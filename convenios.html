<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Convenios · PARADISE</title>

<!--
  CONVENIOS (2026-11-15; con datos desde 2026-11-27)
  ==================================================
  Los descuentos con empresas aliadas. Los crea y edita SOLO el CEO (Admin ›
  Administración › Convenios o la web del personal › ☰ › Convenios); aquí la
  modelo ve los activos: foto, nombre, descripción, requisitos y contacto.
  Datos: /api/convenios (api/convenios.py). Lógica en js/convenios.js.
-->

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconos/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PARADISE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
    --fondo:      #0a0a0b;
    --panel:      #141416;
    --panel-alto: #1a1a1d;
    --borde:      #34322b;
    --texto:      #f4f1e8;
    --tenue:      #a9a595;
    --apagado:    #6f6c62;
    --mid:        #d9b44a;
    --soft:       #f6ecc8;
    --high:       #c0661a;
    --verde:      #f3d98b;
    --rojo:       #ef4444;
    --degradado: linear-gradient(135deg, #f6e3a1 0%, #d9b44a 45%, #b58a28 100%);
    --radio: 16px;
}

* { box-sizing: border-box; }

body {
    margin: 0; background: var(--fondo); color: var(--texto);
    font-family: 'Ubuntu', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 110px;
}
button { font-family: inherit; cursor: pointer; }
.oculto { display: none !important; }
.barra { display: flex; align-items: center; gap: 12px; padding: 16px 18px 10px; max-width: 760px; margin: 0 auto; }
.barra .marca { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; flex: none; }
.barra .marca img { width: 30px; height: 30px; object-fit: contain; }
.contenido { padding: 6px 18px 0; max-width: 760px; margin: 0 auto; }
.conv-cargando, .conv-vacio { color: var(--tenue); font-size: 13.5px; text-align: center; padding: 26px 8px; line-height: 1.5; }
.conv-tarjeta {
    background: rgba(20, 20, 22, .93); border: 1px solid var(--borde); border-radius: var(--radio);
    overflow: hidden; margin-bottom: 14px;
}
.conv-foto { display: block; width: 100%; max-height: 260px; object-fit: cover; background: #1f1c14; cursor: zoom-in; }
.conv-cuerpo { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.conv-cuerpo h2 { margin: 0; font-size: 18px; font-weight: 500; color: var(--soft); }
.conv-cuerpo p { margin: 0; font-size: 14px; line-height: 1.5; color: #dcd8cc; white-space: pre-wrap; overflow-wrap: anywhere; }
.conv-bloque { border-top: 1px solid var(--borde); padding-top: 8px; }
.conv-bloque b { display: block; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--mid); margin-bottom: 3px; font-weight: 500; }
.conv-bloque a { color: var(--verde); }
.conv-visor { position: fixed; inset: 0; z-index: 90; background: rgba(0, 0, 0, .92); display: grid; place-items: center; padding: 16px; }
.conv-visor img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; }
</style>
<link rel="stylesheet" href="css/tema_dorado.css">
</head>

<body>

<div class="barra">
    <div class="marca"><img src="img/convenios.png" alt=""></div>
    <div>
        <div style="font-size:15px;font-weight:600">Convenios</div>
        <div style="font-size:11px;color:var(--tenue)">Descuentos especiales Paradise</div>
    </div>
</div>

<main class="contenido">
    <div id="convenios"><div class="conv-cargando">Cargando…</div></div>
</main>

<!-- La barra vieja: escondida, js/barra_modelo.js pone la nueva. -->
<nav class="navegacion"></nav>
<div id="capas"></div>

<script src="js/config.js"></script>
<script src="js/push.js"></script>
<script src="js/adjuntos.js"></script>
<script src="js/barra_modelo.js"></script>
<script src="js/convenios.js"></script>
<script>
if (!localStorage.getItem('token_sesion')) window.location.href = PARADISE.URL_LOGIN;
</script>
</body>
</html>
