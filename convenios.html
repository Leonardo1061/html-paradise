<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Convenios · PARADISE</title>

<!--
  CONVENIOS (2026-11-15; con datos desde 2026-11-27)
  ==================================================
  Los descuentos con empresas aliadas. Los crea y edita SOLO el CEO (Admin ›
  Administración › Convenios o la web del personal › ☰ › Convenios); aquí la
  modelo ve los activos en tarjetas como las de la SexShop (foto, nombre y
  descripción corta) con el botón dorado «Más info», que abre todo: foto
  grande, descripción, requisitos y contacto (Leonardo, 2026-11-27).
  Datos: /api/convenios (api/convenios.py). Lógica en js/convenios.js.
-->

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconos/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PARADISE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
    --fondo:      #0a0a0b;
    --panel:      #141416;
    --panel-alto: #1a1a1d;
    --borde:      #34322b;
    --texto:      #f4f1e8;
    --tenue:      #a9a595;
    --apagado:    #6f6c62;
    --mid:        #d9b44a;
    --soft:       #f6ecc8;
    --high:       #c0661a;
    --verde:      #f3d98b;
    --rojo:       #ef4444;
    --degradado: linear-gradient(135deg, #f6e3a1 0%, #d9b44a 45%, #b58a28 100%);
    --radio: 16px;
}

* { box-sizing: border-box; }

body {
    margin: 0; background: var(--fondo); color: var(--texto);
    font-family: 'Ubuntu', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 110px;
}
button { font-family: inherit; cursor: pointer; }
.oculto { display: none !important; }
.barra { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px; max-width: 760px; margin: 0 auto; }
.barra h1 { margin: 0; font-size: 17px; font-weight: 700; white-space: nowrap; }
.contenido { padding: 6px 18px 0; max-width: 760px; margin: 0 auto; }

/* El buscador redondo de la derecha, con la lupa. */
.buscador {
    margin-left: auto; flex: 1 1 auto; min-width: 0; max-width: 240px;
    display: flex; align-items: center; gap: 7px;
    background: #3a3a3c; border-radius: 999px; padding: 0 12px; height: 30px;
}
.buscador img { width: 15px; height: 15px; flex: none; opacity: .95; }
.buscador input {
    flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--texto);
    font-size: 14px; padding: 0;
}
.buscador input::placeholder { color: #9a978d; }
.buscador input::-webkit-search-cancel-button { filter: invert(1); }

.cuenta { font-size: 12px; color: var(--tenue); margin: 0 2px 10px; }
.prods { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (min-width: 620px) { .prods { grid-template-columns: repeat(3, 1fr); } }
.prod {
    background: rgba(24, 24, 27, .94); border: 1px solid #2b2a27; border-radius: 8px;
    overflow: hidden; display: flex; flex-direction: column;
}
.prod .im {
    aspect-ratio: 1 / 1; background: radial-gradient(circle at 50% 40%, #3a3326, #17150f 75%);
    display: grid; place-items: center; overflow: hidden;
}
.prod .im img { width: 100%; height: 100%; object-fit: cover; display: block; }
.prod .im .sin { font-size: 34px; opacity: .55; }
.prod .tx { padding: 10px 11px 11px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.prod b {
    font-size: 14px; font-weight: 700; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.prod .precio { color: #f3d98b; font-size: 15px; font-weight: 500; }
.prod .bo {
    margin-top: auto; background: var(--degradado); color: #1a1404; border: 0; border-radius: 6px;
    padding: 8px 4px; font-size: 14px; font-weight: 500;
}
.prod .tx > .bo { margin-top: 8px; }

.prod .desc {
    font-size: 12.5px; color: var(--tenue); line-height: 1.35; min-height: 2.7em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.aviso { text-align: center; color: var(--tenue); font-size: 14px; padding: 34px 10px; }

/* «Más info»: la hoja con todo el convenio. */
.conv-capa { position: fixed; inset: 0; z-index: 80; }
.conv-velo { position: absolute; inset: 0; background: rgba(0, 0, 0, .72); }
.conv-hoja {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 92dvh; overflow-y: auto;
    background: #0e0e10; border-top: 1px solid #6b5520; border-radius: 18px 18px 0 0;
    padding-bottom: calc(18px + env(safe-area-inset-bottom));
}
@media (min-width: 760px) { .conv-hoja { left: 50%; transform: translateX(-50%); width: 560px; bottom: 4vh; border-radius: 18px; border: 1px solid #6b5520; } }
.conv-hoja .foto { width: 100%; max-height: 340px; object-fit: cover; display: block; background: #1f1c14; }
.conv-hoja .cerrar {
    position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%;
    border: 0; background: rgba(0, 0, 0, .65); color: #fff; font-size: 16px; z-index: 2;
}
.conv-hoja .cuerpo { padding: 16px 18px 6px; display: flex; flex-direction: column; gap: 10px; }
.conv-hoja h2 { margin: 0; font-size: 19px; font-weight: 700; color: var(--soft); padding-right: 30px; }
.conv-hoja p { margin: 0; font-size: 14px; line-height: 1.5; color: #dcd8cc; white-space: pre-wrap; overflow-wrap: anywhere; }
.conv-bloque { border-top: 1px solid var(--borde); padding-top: 9px; }
.conv-bloque b { display: block; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--mid); margin-bottom: 3px; font-weight: 500; }
.conv-bloque a { color: var(--verde); }
.prod .redes { display: flex; gap: 5px; min-height: 18px; margin-top: 2px; }
.prod .redes img { width: 18px; height: 18px; }
.conv-enlaces { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.conv-enlaces a {
    display: flex; align-items: center; gap: 10px; color: var(--texto); text-decoration: none;
    background: #17171a; border: 1px solid var(--borde); border-radius: 10px; padding: 8px 10px; font-size: 14px;
}
.conv-enlaces a:active { border-color: var(--mid); }
.conv-enlaces img { width: 28px; height: 28px; flex: none; }
.conv-enlaces span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
<link rel="stylesheet" href="css/tema_dorado.css">
</head>

<body>

<div class="barra">
    <h1>Convenios</h1>
    <label class="buscador">
        <img src="img/lupa.png" alt="">
        <input type="search" id="buscar" placeholder="Buscar" autocomplete="off" enterkeyhint="search" aria-label="Buscar por empresa">
    </label>
</div>

<main class="contenido">
    <div class="cuenta" id="cuenta"></div>
    <div class="prods" id="convenios"></div>
    <div class="aviso" id="aviso">Cargando los convenios…</div>
</main>

<!-- La barra vieja: escondida, js/barra_modelo.js pone la nueva. -->
<nav class="navegacion"></nav>
<div id="capas"></div>

<script src="js/config.js"></script>
<script src="js/push.js"></script>
<script src="js/adjuntos.js"></script>
<script src="js/barra_modelo.js"></script>
<script>
if (!localStorage.getItem('token_sesion')) window.location.href = PARADISE.URL_LOGIN;
</script>
<script src="js/convenios.js"></script>
</body>
</html>
