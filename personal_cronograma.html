<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Cronograma · PARADISE</title>

<!--
  CRONOGRAMA DE ACTIVIDADES DEL PERSONAL  (api/cronograma.py y api/actividades.py)
  ================================================================================
  ARRIBA, LA MALLA PROPIA: la semana de quien entró en bloques de media hora,
  de 7:00 am a 2:00 am. Su turno va sombreado y lo demás queda vacío. Encima,
  las actividades:
      📝 Personal         lo que está haciendo (la pone él, dentro de su turno)
      🎓 Managers         capacitaciones del personal (cualquiera del personal)
      📞 Reunión con modelos  a una o varias modelos o a una jornada entera
      🔒 Reunión privada  quien la da y UNA modelo: la sala de Meet es solo para
                          ellos dos y ninguna otra modelo recibe aviso. Si aún no
                          es modelo, solo su nombre (`invitada`); al darle accesos,
                          ✏️ Cambiar y se la elige en la lista
      📣 Reunión general  (CEO y Gerencia)
  Las reuniones pueden crear su sala de Meet con la cuenta del estudio
  (theparadisemonitor): invita por correo y el acta de Gemini queda pegada a
  la actividad. A todas las modelos les llega el aviso con el link.
  Tocar un hueco programa ahí; tocar una actividad la abre (cambiarla o
  quitarla si es suya; lo de CEO y Gerencia solo lo mueven ellos).
  Cada monitor ve SOLO su malla. CEO y Gerencia eligen de quién.

  ABAJO, EL RESUMEN: los turnos de la semana de todos, con sus horas.

  PESTAÑA «📞 REUNIONES»: las salas de Meet de los últimos 14 días y las que
  vienen, con su acta (también las del escritorio). Reemplaza al botón
  REUNIONES de la barra y a reuniones.html (Leonardo, 2026-10-12).

  De miércoles a viernes 11:59 pm, quien elige descanso tiene arriba los días
  de la semana siguiente (lo mismo que sale en la campana).
-->

<link rel="apple-touch-icon" href="iconos/icono-192.png">

<style>
.semana { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.semana .etiqueta { font-weight: 600; font-size: 14px; flex: 1; min-width: 150px; text-align: center; }
.semana button { padding: 8px 13px; }
.ir-fecha { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--tenue); }
.ir-fecha input { background: var(--panel-alto); color: var(--texto); border: 1px solid var(--borde);
                  border-radius: 10px; padding: 7px 9px; font-size: 13px; color-scheme: dark; }
.barra-malla { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.barra-malla select { background: var(--panel-alto); color: var(--texto); border: 1px solid var(--borde);
                      border-radius: 10px; padding: 8px 10px; font-size: 13px; }
.barra-malla .boton-principal { width: auto; padding: 9px 14px; font-size: 13.5px; }
.leyenda { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--tenue); margin-bottom: 8px; }
.leyenda span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 3px;
                        background: var(--c); margin-right: 5px; vertical-align: -1px; }

/* ---- la malla de media hora: una columna por día, actividades encima ---- */
.desliza { overflow-x: auto; border: 1px solid var(--borde); border-radius: 14px; }
.malla { display: grid; grid-template-columns: 58px repeat(7, minmax(92px, 1fr)); min-width: 720px; position: relative; }
.malla .cabeza { position: sticky; top: 0; z-index: 3; background: var(--panel-alto); text-align: center;
                 font-size: 11.5px; font-weight: 600; color: var(--tenue); padding: 7px 2px; border-bottom: 1px solid var(--borde); }
.malla .cabeza small { display: block; font-weight: 400; color: var(--apagado); }
.malla .cabeza.hoy { color: var(--cian); }
.horas { position: relative; }
.horas div { height: var(--fila); font-size: 10.5px; color: var(--apagado); text-align: right; padding-right: 6px;
             transform: translateY(-6px); }
.columna { position: relative; border-left: 1px solid var(--borde); cursor: pointer;
           background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--fila) * 2 - 1px),
                             var(--borde) calc(var(--fila) * 2 - 1px), var(--borde) calc(var(--fila) * 2)); }
.columna.hoy { background-color: rgba(6, 182, 212, .05); }
.turno-fondo { position: absolute; left: 0; right: 0; background: rgba(6, 182, 212, .10);
               border-top: 1px dashed rgba(6, 182, 212, .5); border-bottom: 1px dashed rgba(6, 182, 212, .5);
               pointer-events: none; }
.descanso-fondo { position: absolute; inset: 0; display: grid; place-items: center; color: var(--apagado);
                  font-size: 12px; pointer-events: none; }
.actividad { position: absolute; border-radius: 7px; padding: 3px 5px; font-size: 10.5px; line-height: 1.25;
             color: #fff; background: var(--c); overflow: hidden; cursor: pointer; z-index: 2;
             box-shadow: 0 2px 6px rgba(0, 0, 0, .35); border: 1px solid rgba(255, 255, 255, .18); }
.actividad b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.actividad small { opacity: .85; }

/* ---- el resumen de todos ---- */
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { border-bottom: 1px solid var(--borde); padding: 7px 6px; text-align: center; vertical-align: middle; }
th { color: var(--tenue); font-weight: 600; font-size: 11.5px; background: var(--panel-alto); }
th small { display: block; font-weight: 400; color: var(--apagado); }
th.hoy, td.hoy { background: rgba(6, 182, 212, .08); }
.resumen td:first-child, .resumen th:first-child { text-align: left; position: sticky; left: 0; background: var(--panel); z-index: 1; min-width: 120px; }
.resumen .persona b { display: block; font-size: 12.5px; }
.resumen .persona small { color: var(--tenue); }
.resumen .origen { display: block; color: var(--apagado); font-size: 10.5px; margin-top: 2px; }
.turno { display: block; padding: 6px 4px; border-radius: 9px; font-size: 11px; line-height: 1.3; min-width: 88px;
         background: color-mix(in srgb, var(--c) 20%, transparent); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); }
.turno.descanso { background: transparent; border: 1px dashed var(--borde); color: var(--tenue); }
.turno.libre { background: transparent; border: 0; color: var(--apagado); }
.turno .cubre { display: block; font-size: 10px; color: var(--ambar); }
.total { font-weight: 700; color: var(--cian); white-space: nowrap; }
.cambiar { margin-top: 5px; width: 100%; font-size: 11px; padding: 4px; border-radius: 8px;
           background: var(--panel-alto); color: var(--texto); border: 1px solid var(--borde); }
.nota { font-size: 12px; color: var(--tenue); line-height: 1.5; margin: 8px 2px 0; }
#eleccion { margin-bottom: 14px; }

/* ---- el formulario ---- */
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.personas-lista { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-height: 190px; overflow-y: auto;
                  background: var(--panel-alto); border: 1px solid var(--borde); border-radius: 12px; padding: 10px; }
.personas-lista label { display: flex; gap: 7px; align-items: center; font-size: 13px; color: var(--texto); margin: 0; }
.personas-lista input { width: auto; padding: 0; margin: 0; flex: none; }
.crear-meet { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--texto); margin: 0 0 12px; line-height: 1.4; }
.crear-meet input { width: auto; margin: 2px 0 0; flex: none; }
.vista-reuniones .reunion { border-top: 1px solid var(--borde); padding: 12px 0; }
.vista-reuniones .reunion:first-child { border-top: 0; padding-top: 0; }
.vista-reuniones .reunion b { font-size: 14px; }
.vista-reuniones .reunion .linea { font-size: 12.5px; color: var(--tenue); margin-top: 3px; line-height: 1.45; }
.vista-reuniones .reunion .pildora { text-decoration: none; display: inline-block; margin: 7px 6px 0 0; }
.vista-reuniones .dia { font-size: 12px; font-weight: 600; color: var(--cian); margin: 16px 0 8px; }
.vista-reuniones .dia:first-child { margin-top: 0; }
.citadas-elegidas { font-size: 12.5px; color: var(--tenue); margin: 6px 0 0; line-height: 1.4; }
.personas-lista label.todos { grid-column: 1 / -1; font-weight: 600; border-bottom: 1px solid var(--borde); padding-bottom: 6px; }
.error-form { color: #fecaca; font-size: 13px; margin: 0 0 10px; display: none; }
.detalle-actividad p { margin: 6px 0; font-size: 13.5px; color: var(--tenue); line-height: 1.5; }
.detalle-actividad b { color: var(--texto); }
</style>
</head>

<body>

<main class="contenido">
    <h1 class="titulo-pagina">🗓️ Cronograma de actividades</h1>
    <div class="pestanas" id="vistas">
        <button class="pestana activa" data-vista="malla">🗓️ Malla</button>
        <button class="pestana" data-vista="reuniones">📞 Reuniones</button>
    </div>
    <div id="vista-reuniones" class="vista-reuniones oculto"></div>
    <div id="vista-malla">
    <div id="eleccion"></div>
    <div class="semana">
        <button class="boton-secundario" id="btn-anterior">◀</button>
        <div class="etiqueta" id="etiqueta-semana">Cargando…</div>
        <button class="boton-secundario" id="btn-siguiente">▶</button>
        <button class="boton-secundario" id="btn-hoy">Esta semana</button>
        <!-- HISTORIAL (Leonardo, 2026-10-15): cualquier fecha lleva a su semana.
             CEO y Gerencia, con el selector de persona, ven la de cualquier monitor. -->
        <label class="ir-fecha">📅 Ir a la fecha <input type="date" id="fecha-semana"></label>
    </div>
    <div id="contenido"><div class="cargando"><span class="girando">◌</span></div></div>
    </div>
</main>

<script src="js/config.js"></script>
<script src="js/push.js"></script>
<script src="js/personal.js"></script>
<script>
(function () {
    'use strict';
    const P = window.Personal;
    const esc = (t) => P.escapar(t);
    const corto = (n) => String(n || '').split(' ')[0];
    const FILA = 26;                       // px por media hora
    const COLORES = {
        'Julian Mosquera': '#f59e0b', 'Leonardo Muñoz': '#06b6d4', 'Alexander Alban': '#8b5cf6',
        'Mayra Vargas': '#d946ef', 'Angela Diaz': '#10b981',
    };
    const estado = { semana: '', persona: '', malla: null, resumen: null, opciones: null };

    function etiquetaMinuto(m) {
        const h = Math.floor(m / 60) % 24, mm = m % 60;
        if (h === 12 && mm === 0) return '12:00 m';
        return ((h % 12) || 12) + ':' + String(mm).padStart(2, '0') + ' ' + (h < 12 ? 'am' : 'pm');
    }

    function hoyIndice(datos) { return datos.semana === datos.actual ? new Date().getDay() : -1; }

    // ===================================================================
    // LA MALLA PROPIA
    // ===================================================================
    function htmlMalla(m) {
        const primero = m.filas[0].minuto;
        const alto = m.filas.length * FILA;
        const hoy = hoyIndice(m);
        const y = (minuto) => (minuto - primero) / 30 * FILA;
        let html = '<div class="desliza"><div class="malla" style="--fila:' + FILA + 'px">' +
            '<div class="cabeza"></div>' + m.dias.map((d) =>
                '<div class="cabeza' + (d.dia === hoy ? ' hoy' : '') + '">' + esc(d.nombre.slice(0, 3)) +
                '<small>' + esc(d.fecha) + '</small></div>').join('');
        html += '<div class="horas" style="height:' + alto + 'px">' + m.filas.map((f, i) =>
            '<div>' + (i % 2 === 0 ? esc(f.texto) : '') + '</div>').join('') + '</div>';
        m.dias.forEach((d) => {
            const t = m.turnos[d.dia] || {};
            html += '<div class="columna' + (d.dia === hoy ? ' hoy' : '') + '" data-dia="' + d.dia +
                '" style="height:' + alto + 'px">';
            if (t.desde != null) {
                html += '<div class="turno-fondo" title="' + esc(t.texto + (t.cubre ? ' · cubre a ' + corto(t.cubre) : '')) +
                    '" style="top:' + y(t.desde) + 'px;height:' + (y(t.hasta) - y(t.desde)) + 'px"></div>';
            } else if (t.descanso) {
                html += '<div class="descanso-fondo">🛌 Descanso</div>';
            }
            // Las que se cruzan (solo puede pasar con lo de CEO/Gerencia) van lado a lado.
            const delDia = m.actividades.filter((a) => a.dia === d.dia).sort((a, b) => a.inicio - b.inicio);
            const carriles = [];
            delDia.forEach((a) => {
                let c = carriles.findIndex((fin) => fin <= a.inicio);
                if (c < 0) { c = carriles.length; carriles.push(0); }
                carriles[c] = a.inicio + a.duracion;
                a._carril = c;
            });
            const n = Math.max(1, carriles.length);
            delDia.forEach((a) => {
                html += '<div class="actividad" data-id="' + esc(a.id) + '" style="--c:' + esc(a.color) +
                    ';top:' + (y(a.inicio) + 1) + 'px;height:' + (a.duracion / 30 * FILA - 2) + 'px;left:calc(' +
                    (a._carril * 100 / n) + '% + 2px);width:calc(' + (100 / n) + '% - 4px)" title="' +
                    esc(a.titulo + ' · ' + a.cuando) + '"><b>' + esc(a.icono + ' ' + a.titulo) + '</b><small>' +
                    esc(etiquetaMinuto(a.inicio) + ' – ' + etiquetaMinuto(a.inicio + a.duracion)) +
                    (a.tipo === 'modelos' || a.tipo === 'privada' ? ' · ' + esc(a.modelo) : '') + '</small></div>';
            });
            html += '</div>';
        });
        return html + '</div></div>';
    }

    function pintarMalla() {
        const m = estado.malla;
        if (!m) return;
        const propia = m.persona === P.ficha().monitor;
        let html = '<div class="titulo-seccion">' + (propia ? 'Mi malla' : 'Malla de ' + esc(m.persona)) + '</div>' +
            '<div class="barra-malla">' +
            (m.es_jefe ? '<select id="sel-persona">' + m.personas.map((p) =>
                '<option' + (p === m.persona ? ' selected' : '') + '>' + esc(p) + '</option>').join('') + '</select>' : '') +
            '<button class="boton-principal" id="btn-programar">＋ Programar actividad</button></div>' +
            '<div class="leyenda">' + m.tipos.map((t) => '<span style="--c:' + t.color + '">' + esc(t.icono + ' ' + t.texto) + '</span>').join('') +
            '<span style="--c:rgba(6,182,212,.35)">Tu turno</span></div>' +
            htmlMalla(m) +
            '<p class="nota">Toca un hueco para programar ahí o una actividad para verla. ' +
            (m.es_jefe ? 'Como CEO o Gerencia puedes programar a cualquier hora. ' :
                         'Tus actividades personales van dentro de tu turno; las reuniones, a cualquier hora. ') +
            'Una actividad puede ir encima de otra: si no vas a una reunión, pon encima lo que estás haciendo ' +
            '(abre la reunión y toca «＋ Poner algo encima»).</p>';
        document.getElementById('malla').innerHTML = html;
        const sel = document.getElementById('sel-persona');
        if (sel) sel.onchange = () => { estado.persona = sel.value; cargarMalla(); };
        document.getElementById('btn-programar').onclick = () => abrirFormulario({});
        document.querySelectorAll('#malla .actividad').forEach((el) => {
            el.onclick = (e) => {
                e.stopPropagation();
                const a = m.actividades.find((x) => x.id === el.dataset.id);
                if (a) abrirDetalle(a);
            };
        });
        document.querySelectorAll('#malla .columna').forEach((col) => {
            col.onclick = (e) => {
                const caja = col.getBoundingClientRect();
                const fila = Math.floor((e.clientY - caja.top) / FILA);
                const minuto = m.filas[0].minuto + Math.max(0, fila) * 30;
                abrirFormulario({ dia: Number(col.dataset.dia), inicio: minuto });
            };
        });
    }

    // ===================================================================
    // HOJAS: detalle y formulario
    // ===================================================================
    function abrirHoja(titulo, html) {
        const capas = document.getElementById('capas-personal');
        capas.innerHTML = '<div class="velo"></div><div class="hoja"><div class="hoja-cabecera"><h3>' + esc(titulo) +
            '</h3><button class="cerrar" title="Cerrar">✕</button></div><div class="hoja-cuerpo">' + html + '</div></div>';
        const cerrar = () => { capas.innerHTML = ''; };
        capas.querySelector('.velo').onclick = cerrar;
        capas.querySelector('.cerrar').onclick = cerrar;
        return { cuerpo: capas.querySelector('.hoja-cuerpo'), cerrar: cerrar };
    }

    function abrirDetalle(a) {
        const hoja = abrirHoja(a.icono + ' ' + a.titulo,
            '<div class="detalle-actividad">' +
            '<p><b>' + esc(a.texto_tipo) + '</b> · ' + esc(a.cuando) + '</p>' +
            (a.tipo === 'modelos' ? '<p>Reunión de <b>' + esc(a.responsable) + '</b> con <b>' +
                esc(a.jornada_citada ? 'toda la jornada ' + a.jornada_citada : a.modelo) +
                '</b>. Les llega a todas las modelos' + (a.meet ? ', con el link' : '') + '.</p>' : '') +
            (a.tipo === 'privada' ? '<p>Reunión privada de <b>' + esc(a.responsable) + '</b> con <b>' + esc(a.modelo) +
                '</b>. La sala es solo para ellos dos: a ninguna otra modelo le llega el aviso.</p>' +
                (a.cedulas && a.cedulas.length ? '' : '<p class="nota">Aún sin accesos: no le llega a ninguna modelo. Cuando ' +
                    'se los den, en ✏️ Cambiar tócala en la lista y le llega el aviso.</p>') : '') +
            (a.tipo === 'managers' ? '<p>Para: ' + esc(a.personas.join(', ')) + '</p>' : '') +
            (a.descripcion ? '<p>' + esc(a.descripcion) + '</p>' : '') +
            (a.meet ? '<p><a href="' + esc(a.meet) + '" target="_blank" rel="noopener">🎥 Enlace de la reunión</a></p>' : '') +
            (a.meet_estudio ? '<p class="nota">Sala de la cuenta del estudio: ' + a.meet_invitados + ' invitados entran directo' +
                (a.meet_sin_correo ? ' y ' + a.meet_sin_correo + ' sin correo piden entrar' : '') +
                '. Para las notas, entra con esa cuenta y activa «Tomar notas con Gemini».</p>' : '') +
            (a.acta ? '<p><a href="' + esc(a.acta) + '" target="_blank" rel="noopener">📝 Notas de Gemini</a></p>' : '') +
            '<p>Programada por ' + esc(a.creada_por) + '.</p>' +
            '<div class="botones" style="margin-top:14px"><button class="boton-secundario" id="btn-encima">＋ Poner algo encima</button>' +
            (a.puede_editar ? '<button class="boton-secundario" id="btn-editar">✏️ Cambiar</button>' +
                '<button class="boton-secundario" id="btn-borrar">🗑️ Quitar</button></div>'
                : '</div><p style="color:var(--apagado)">' + (a.de_jefe ? 'La programó CEO o Gerencia: solo ellos la mueven.' : 'Solo quien la puso la cambia.') + '</p>') +
            '</div>');
        // Encima de otra (Leonardo, 2026-10-15): el mismo día y la misma hora.
        hoja.cuerpo.querySelector('#btn-encima').onclick = () =>
            abrirFormulario({ dia: a.dia, inicio: a.inicio, duracion: a.duracion });
        if (!a.puede_editar) return;
        hoja.cuerpo.querySelector('#btn-editar').onclick = () => abrirFormulario(a);
        hoja.cuerpo.querySelector('#btn-borrar').onclick = async () => {
            if (!confirm('¿Quitar «' + a.titulo + '»?')) return;
            try {
                const r = await P.pedir('/api/personal/cronograma/actividades/' + encodeURIComponent(a.id) + '/borrar', 'POST');
                P.avisar(r.mensaje, 'bueno');
                hoja.cerrar();
                cargarMalla();
            } catch (error) { P.avisar(error.message, 'malo'); }
        };
    }

    async function opciones() {
        if (!estado.opciones) estado.opciones = await P.pedir('/api/personal/cronograma/opciones');
        return estado.opciones;
    }

    /* previo: {dia, inicio} de un hueco, o una actividad para cambiarla. */
    async function abrirFormulario(previo) {
        const m = estado.malla;
        const editando = !!previo.id;
        let ops;
        try { ops = await opciones(); } catch (error) { P.avisar(error.message, 'malo'); return; }
        const dia = previo.dia != null ? previo.dia : (hoyIndice(m) >= 0 ? hoyIndice(m) : 1);
        const turno = m.turnos[dia] || {};
        const inicio = previo.inicio != null ? previo.inicio : (turno.desde != null ? turno.desde - turno.desde % 30 : 9 * 60);
        const duraciones = [30, 60, 90, 120, 150, 180, 240, 300, 360, 480];
        const tipos = editando ? m.tipos.filter((t) => t.id === previo.tipo) : m.tipos;
        const hoja = abrirHoja(editando ? 'Cambiar actividad' : 'Programar actividad',
            '<div class="error-form" id="f-error"></div>' +
            '<div class="campo"><label>Tipo</label><select id="f-tipo"' + (editando ? ' disabled' : '') + '>' +
                tipos.map((t) => '<option value="' + t.id + '"' + (t.id === previo.tipo ? ' selected' : '') + '>' +
                esc(t.icono + ' ' + t.texto) + '</option>').join('') + '</select></div>' +
            '<div class="campo"><label>Qué es</label><input id="f-titulo" maxlength="120" placeholder="Ej: Subiendo contenido de Valentina" value="' +
                esc(previo.titulo || '') + '"></div>' +
            '<div class="dos"><div class="campo"><label>Día</label><select id="f-dia">' + m.dias.map((d) =>
                '<option value="' + d.dia + '"' + (d.dia === dia ? ' selected' : '') + '>' + esc(d.nombre + ' ' + d.fecha) + '</option>').join('') +
            '</select></div><div class="campo"><label>Hora</label><select id="f-inicio">' + m.filas.map((f) =>
                '<option value="' + f.minuto + '"' + (f.minuto === inicio ? ' selected' : '') + '>' + esc(f.texto) + '</option>').join('') +
            '</select></div></div>' +
            '<div class="campo"><label>Duración</label><select id="f-duracion">' + duraciones.map((d) =>
                '<option value="' + d + '"' + (d === (previo.duracion || 60) ? ' selected' : '') + '>' +
                (d < 60 ? '30 min' : (d / 60) + (d === 60 ? ' hora' : ' horas')) + '</option>').join('') + '</select></div>' +
            '<div id="f-extra"></div>' +
            '<div class="campo"><label>Detalle (opcional)</label><textarea id="f-descripcion">' + esc(previo.descripcion || '') + '</textarea></div>' +
            '<button class="boton-principal" id="f-guardar">' + (editando ? 'Guardar cambios' : 'Programar') + '</button>');
        const $f = (id) => hoja.cuerpo.querySelector('#' + id);

        function pintarExtra() {
            const tipo = $f('f-tipo').value;
            let html = '';
            if (tipo === 'managers' || (m.es_jefe && tipo === 'personal')) {
                const marcadas = editando ? previo.personas : [m.persona];
                html += '<div class="campo"><label>' + (tipo === 'managers' ? 'Para quién' : 'En la malla de') + '</label><div class="personas-lista">' +
                    (tipo === 'managers' ? '<label class="todos"><input type="checkbox" id="f-todos"> Todos</label>' : '') +
                    ops.personal.map((p) => '<label><input type="checkbox" class="f-persona" value="' + esc(p) + '"' +
                        (marcadas.indexOf(p) >= 0 ? ' checked' : '') + '> ' + esc(p) + '</label>').join('') + '</div></div>';
            }
            const privada = tipo === 'privada';
            citar.una = privada;
            citar.modo = 'modelos';
            if (privada && citar.elegidas.size > 1) citar.elegidas.clear();
            // La privada también se cambia al editar: así, a quien se citó solo con
            // su nombre se le asigna su cédula cuando le dan los accesos.
            if ((tipo === 'modelos' && !editando) || privada) {
                html += '<div class="campo"><label>' + (privada ? 'Con qué modelo (solo ella recibe el aviso y la invitación)'
                        : 'Con quién es la reunión (el aviso les llega a todas las modelos)') + '</label>' +
                    (privada ? '' : '<div class="pestanas" id="f-citar"><button type="button" class="pestana activa" data-citar="modelos">Modelos</button>' +
                    '<button type="button" class="pestana" data-citar="jornada">Toda una jornada</button></div>') +
                    '<div id="f-sec-modelos"><div class="selector-modelos" id="f-modelos"><input class="buscar" type="search" placeholder="Buscar modelo…" autocomplete="off">' +
                    '<div class="opciones"></div></div><p class="citadas-elegidas" id="f-elegidas">Toca a las modelos que vas a citar.</p></div>' +
                    '<div id="f-sec-jornada" class="oculto"><select id="f-jornada">' + (ops.jornadas || []).map((j) =>
                        '<option value="' + esc(j) + '">' + esc(j) + '</option>').join('') + '</select>' +
                    '<p class="citadas-elegidas" id="f-conteo"></p></div></div>' +
                    (privada ? '<div class="campo"><label>¿Aún no es modelo del estudio? Escribe su nombre (opcional)</label>' +
                        '<input id="f-invitada" maxlength="80" placeholder="Ej: Lisbeth Montenegro" value="' +
                        esc(editando && !(previo.cedulas || []).length ? previo.invitada || '' : '') + '">' +
                        '<p class="citadas-elegidas">Con solo el nombre no le llega a ninguna modelo. Cuando le den sus accesos, ' +
                        'entra a ✏️ Cambiar y tócala en la lista: le llega el aviso y la invitación.</p></div>' : '');
                if (m.es_jefe && !editando) {
                    html += '<div class="campo"><label>Quién la da</label><select id="f-responsable">' + ops.personal.map((p) =>
                        '<option' + (p === m.persona ? ' selected' : '') + '>' + esc(p) + '</option>').join('') + '</select></div>';
                }
            }
            if (privada && !previo.meet_estudio) {
                html += '<p class="nota" style="margin:0 0 12px">🔒 Se crea la sala de Meet con la cuenta del estudio, con invitación ' +
                    'solo para quien la da y la modelo. Quien tenga la Admin abierta recibe la alerta para tomar las notas.</p>';
            } else if ((tipo === 'reunion' || tipo === 'managers' || tipo === 'modelos' || privada) && previo.meet_estudio) {
                html += '<p class="nota" style="margin:0 0 12px">📹 Ya tiene sala de Meet de la cuenta del estudio: si cambias la hora, la sala se mueve sola.</p>';
            } else if (tipo === 'reunion' || tipo === 'managers' || tipo === 'modelos') {
                html += '<label class="crear-meet"><input type="checkbox" id="f-crear-meet"' + (editando ? '' : ' checked') + '> ' +
                    '📹 Crear la sala de Meet con la cuenta del estudio e invitar a ' +
                    (tipo === 'reunion' ? 'todo el personal y las modelos' : tipo === 'modelos' ? 'las modelos' : 'quienes van') +
                    ' (con su correo)</label>' +
                    '<div class="campo" id="f-campo-meet"><label>Enlace de Meet (opcional)</label><input id="f-meet" placeholder="https://meet.google.com/…" value="' +
                    esc(previo.meet || '') + '"></div>';
            }
            if (tipo === 'reunion') html += '<p class="nota" style="margin:0 0 12px">Le llega a todo el personal y a todas las modelos.</p>';
            $f('f-extra').innerHTML = html;
            if ($f('f-modelos')) prepararCitadas();
            const crearMeet = $f('f-crear-meet');
            if (crearMeet) {
                const alternar = () => $f('f-campo-meet').classList.toggle('oculto', crearMeet.checked);
                crearMeet.onchange = alternar;
                alternar();
            }
            const todos = $f('f-todos');
            if (todos) todos.onchange = () => hoja.cuerpo.querySelectorAll('.f-persona').forEach((c) => { c.checked = todos.checked; });
        }
        // Reunión con modelos: varias (buscador) o una jornada entera.
        const citar = { modo: 'modelos', elegidas: new Set(), una: false };   // una: la privada
        if (editando && previo.tipo === 'privada') (previo.cedulas || []).forEach((c) => citar.elegidas.add(c));
        function prepararCitadas() {
            const caja = $f('f-modelos');
            const sinTildes = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            function pintar() {
                const f = sinTildes(caja.querySelector('.buscar').value.trim());
                const lista = ops.modelos.filter((x) => !f || sinTildes(x.nombre + ' ' + x.jornada).indexOf(f) >= 0);
                const opciones = caja.querySelector('.opciones');
                opciones.innerHTML = lista.length ? lista.map((x) =>
                    '<button type="button" class="opcion' + (citar.elegidas.has(x.cedula) ? ' elegida' : '') + '" data-cedula="' +
                    esc(x.cedula) + '"><span>' + (citar.elegidas.has(x.cedula) ? '✓ ' : '') + esc(x.nombre) + '</span><small>' +
                    esc(x.jornada) + '</small></button>').join('') : '<div class="vacio">Ninguna modelo con ese nombre.</div>';
                opciones.querySelectorAll('.opcion').forEach((b) => {
                    b.onclick = () => {
                        const c = b.dataset.cedula;
                        if (citar.elegidas.has(c)) citar.elegidas.delete(c);
                        else { if (citar.una) citar.elegidas.clear(); citar.elegidas.add(c); }
                        pintar();
                    };
                });
                const nombres = ops.modelos.filter((x) => citar.elegidas.has(x.cedula)).map((x) => x.nombre);
                $f('f-elegidas').textContent = citar.una ? (nombres.length ? 'Con: ' + nombres[0] : 'Toca a la modelo o escribe su nombre abajo.')
                    : nombres.length ? 'Citadas (' + nombres.length + '): ' + nombres.join(', ')
                    : 'Toca a las modelos que vas a citar.';
            }
            function conteo() {
                const j = $f('f-jornada').value;
                const n = ops.modelos.filter((x) => x.jornada === j).length;
                $f('f-conteo').textContent = n ? 'Se citarán ' + n + ' modelo(s) de esa jornada.' : 'No hay modelos en esa jornada.';
            }
            caja.querySelector('.buscar').oninput = pintar;
            $f('f-jornada').onchange = conteo;
            hoja.cuerpo.querySelectorAll('#f-citar .pestana').forEach((b) => {
                b.onclick = () => {
                    citar.modo = b.dataset.citar;
                    hoja.cuerpo.querySelectorAll('#f-citar .pestana').forEach((x) => x.classList.toggle('activa', x === b));
                    $f('f-sec-modelos').classList.toggle('oculto', citar.modo !== 'modelos');
                    $f('f-sec-jornada').classList.toggle('oculto', citar.modo !== 'jornada');
                    conteo();
                };
            });
            pintar();
        }
        $f('f-tipo').onchange = pintarExtra;
        pintarExtra();

        $f('f-guardar').onclick = async () => {
            const tipo = $f('f-tipo').value;
            const diaSel = Number($f('f-dia').value);
            const cuerpo = {
                titulo: $f('f-titulo').value.trim(),
                descripcion: $f('f-descripcion').value.trim(),
                fecha: m.dias[diaSel].iso,
                inicio: Number($f('f-inicio').value),
                duracion: Number($f('f-duracion').value),
            };
            const marcadas = Array.from(hoja.cuerpo.querySelectorAll('.f-persona:checked')).map((c) => c.value);
            if ($f('f-crear-meet') && $f('f-crear-meet').checked) cuerpo.crear_meet = true;
            else if ($f('f-meet')) cuerpo.meet = $f('f-meet').value.trim();
            const error = $f('f-error');
            const boton = $f('f-guardar');
            boton.disabled = true;
            try {
                let r;
                const invitada = $f('f-invitada') ? $f('f-invitada').value.trim() : '';
                if (editando) {
                    if (hoja.cuerpo.querySelector('.f-persona')) cuerpo.personas = marcadas;
                    if (tipo === 'privada') {
                        cuerpo.modelo = Array.from(citar.elegidas)[0] || '';
                        if (!cuerpo.modelo) cuerpo.invitada = invitada;
                    }
                    r = await P.pedir('/api/personal/cronograma/actividades/' + encodeURIComponent(previo.id), 'POST', cuerpo);
                } else {
                    cuerpo.tipo = tipo;
                    cuerpo.personas = hoja.cuerpo.querySelector('.f-persona') ? marcadas : [m.persona];
                    if ($f('f-modelos')) {
                        if (citar.modo === 'jornada' && !citar.una) cuerpo.jornada = $f('f-jornada').value;
                        else cuerpo.modelos = Array.from(citar.elegidas);
                    }
                    if (tipo === 'privada' && !citar.elegidas.size) cuerpo.invitada = invitada;
                    if ($f('f-responsable')) cuerpo.responsable = $f('f-responsable').value;
                    r = await P.pedir('/api/personal/cronograma/actividades', 'POST', cuerpo);
                }
                P.avisar(r.mensaje, 'bueno');
                hoja.cerrar();
                cargarMalla();
            } catch (fallo) {
                error.textContent = fallo.message;
                error.style.display = 'block';
                boton.disabled = false;
            }
        };
    }

    // ===================================================================
    // EL RESUMEN DE TODOS (abajo)
    // ===================================================================
    function celdaResumen(fila, celda) {
        if (celda.descanso) return '<span class="turno descanso">🛌 Descanso</span>';
        if (!celda.turno) return '<span class="turno libre">—</span>';
        return '<span class="turno" style="--c:' + COLORES[fila.persona] + '">' + esc(celda.texto) +
            (celda.cubre ? '<span class="cubre">cubre a ' + esc(corto(celda.cubre)) + '</span>' : '') + '</span>';
    }

    function selectorAjuste(fila, datos) {
        if (!datos.puede_editar || !fila.elige) return '';
        return '<select class="cambiar" data-persona="' + esc(fila.persona) + '">' +
            '<option value="">Cambiar descanso…</option><option value="auto">Automático (quitar cambio)</option>' +
            datos.dias.map((d) => '<option value="' + d.dia + '">' + esc(d.nombre) + ' ' + esc(d.fecha) + '</option>').join('') +
            '</select>';
    }

    function pintarResumen() {
        const datos = estado.resumen;
        if (!datos) return;
        const hoy = hoyIndice(datos);
        const cabeza = '<tr><th></th>' + datos.dias.map((d) =>
            '<th class="' + (d.dia === hoy ? 'hoy' : '') + '">' + esc(d.nombre.slice(0, 3)) + '<small>' + esc(d.fecha) + '</small></th>').join('');
        document.getElementById('resumen').innerHTML =
            '<div class="titulo-seccion" style="margin-top:22px">Turnos de la semana</div><div class="desliza"><table class="resumen">' +
            cabeza + '<th>Horas</th></tr>' + datos.filas.map((f) =>
                '<tr><td class="persona"><b>' + esc(f.persona) + '</b><small>' + esc(f.jornada) + '</small>' +
                (f.texto_origen ? '<span class="origen">Descanso: ' + esc(f.texto_origen) + '</span>' : '') +
                selectorAjuste(f, datos) + '</td>' +
                f.dias.map((c) => '<td class="' + (c.dia === hoy ? 'hoy' : '') + '">' + celdaResumen(f, c) + '</td>').join('') +
                '<td class="total">' + f.horas_semana + ' h</td></tr>').join('') +
            '</table></div><p class="nota">Las horas ya descuentan la media hora de almuerzo.</p>';
        document.querySelectorAll('.cambiar').forEach((s) => {
            s.onchange = async () => {
                if (!s.value) return;
                const persona = s.dataset.persona;
                const dia = s.value === 'auto' ? null : Number(s.value);
                const texto = dia === null ? 'volver al descanso automático de ' + persona
                    : 'poner el descanso de ' + persona + ' el ' + datos.dias[dia].nombre.toLowerCase() + ' ' + datos.dias[dia].fecha;
                if (!confirm('¿' + texto.charAt(0).toUpperCase() + texto.slice(1) + '?')) { s.value = ''; return; }
                try {
                    await P.pedir('/api/personal/cronograma/ajustar', 'POST', { semana: datos.semana, persona: persona, dia: dia });
                    P.avisar('Malla actualizada.', 'bueno');
                } catch (error) { P.avisar(error.message, 'malo'); }
                cargar(datos.semana);
            };
        });
    }

    function pintarEleccion() {
        const caja = document.getElementById('eleccion');
        caja.innerHTML = '';
        const info = estado.resumen && estado.resumen.eleccion;
        if (info) caja.appendChild(P.tarjetaDescanso(info, () => { P.revisarTareas(true); cargar(estado.semana); }));
    }

    // ===================================================================
    // CARGA
    // ===================================================================
    async function cargarMalla() {
        try {
            estado.malla = await P.pedir('/api/personal/cronograma/malla?semana=' + encodeURIComponent(estado.semana) +
                                         '&persona=' + encodeURIComponent(estado.persona || ''));
            estado.persona = estado.malla.persona;
            pintarMalla();
        } catch (error) {
            document.getElementById('malla').innerHTML = '<div class="vacio">' + esc(error.message) + '</div>';
        }
    }

    async function cargar(semana) {
        if (!document.getElementById('malla')) {
            document.getElementById('contenido').innerHTML = '<div id="malla"><div class="cargando"><span class="girando">◌</span></div></div><div id="resumen"></div>';
        }
        try {
            const datos = await P.pedir('/api/personal/cronograma' + (semana ? '?semana=' + encodeURIComponent(semana) : ''));
            estado.resumen = datos;
            estado.semana = datos.semana;
            document.getElementById('fecha-semana').value = datos.semana;
            document.getElementById('etiqueta-semana').textContent =
                (datos.semana === datos.actual ? 'Esta semana · ' : '') + datos.etiqueta;
            pintarEleccion();
            pintarResumen();
            await cargarMalla();
        } catch (error) {
            document.getElementById('contenido').innerHTML = '<div class="vacio">' + esc(error.message) + '</div>';
        }
    }

    // ===================================================================
    // PESTAÑA REUNIONES: las salas de Meet con su acta
    // ===================================================================
    function textoDia(iso) {
        const [a, m, d] = iso.split('-').map(Number);
        const f = new Date(a, m - 1, d);
        const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
        const dif = Math.round((f - hoy) / 86400000);
        const nombre = f.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
        return dif === 0 ? 'Hoy · ' + nombre : dif === -1 ? 'Ayer · ' + nombre : dif === 1 ? 'Mañana · ' + nombre :
            nombre.charAt(0).toUpperCase() + nombre.slice(1);
    }

    async function cargarReuniones() {
        const caja = document.getElementById('vista-reuniones');
        if (!caja.innerHTML) caja.innerHTML = '<div class="cargando"><span class="girando">◌</span></div>';
        try {
            const datos = await P.pedir('/api/personal/cronograma/reuniones?dias=14');
            const lista = datos.reuniones || [];
            if (!lista.length) {
                caja.innerHTML = '<div class="tarjeta"><div class="vacio">No hay reuniones con sala de Meet en los últimos ' +
                    datos.dias + ' días. Prográmalas en la malla y marca «Crear la sala de Meet».</div></div>';
                return;
            }
            let html = '<div class="tarjeta">', dia = '';
            lista.forEach((r) => {
                if (r.fecha !== dia) { dia = r.fecha; html += '<div class="dia">' + esc(textoDia(dia)) + '</div>'; }
                const quienes = r.jornada_citada === 'Todas' ? 'Todo el personal y las modelos'
                    : r.jornada_citada ? 'Jornada ' + r.jornada_citada + ' (' + r.total_modelos + ' modelos)'
                    : (r.modelos || []).join(', ') || 'Personal';
                const acta = r.link_notas
                    ? '<a class="pildora bien" href="' + esc(r.link_notas) + '" target="_blank" rel="noopener">📝 Notas de Gemini</a>'
                    : r.por_venir ? '<span class="pildora cian">🗓️ Programada</span>'
                    : r.estado_acta === 'sin_acta' ? '<span class="pildora">Sin acta</span>'
                    : '<span class="pildora alta">⏳ Esperando notas de Gemini</span>';
                const entrar = r.enlace && (r.por_venir || !r.link_notas)
                    ? '<a class="pildora cian" href="' + esc(r.enlace) + '" target="_blank" rel="noopener">🎥 Entrar</a>' : '';
                html += '<div class="reunion"><b>' + (r.privada ? '🔒 ' : '') + esc(r.titulo || quienes) + '</b>' +
                    '<div class="linea">🕒 ' + esc(r.hora) + ' · 👥 ' + esc(r.monitor) + (r.codigo ? ' · 🔑 ' + esc(r.codigo) : '') + '</div>' +
                    (r.titulo ? '<div class="linea">' + esc(quienes) + '</div>' : '') + acta + entrar + '</div>';
            });
            caja.innerHTML = html + '</div><p class="nota">Las de los últimos ' + datos.dias +
                ' días y las que vienen, también las del escritorio. Las notas salen cuando el vigilante del escritorio encuentra el acta.</p>';
        } catch (error) {
            caja.innerHTML = '<div class="vacio">' + esc(error.message) + '</div>';
        }
    }

    function verVista(vista) {
        document.querySelectorAll('#vistas .pestana').forEach((b) => b.classList.toggle('activa', b.dataset.vista === vista));
        document.getElementById('vista-malla').classList.toggle('oculto', vista !== 'malla');
        document.getElementById('vista-reuniones').classList.toggle('oculto', vista !== 'reuniones');
        if (vista === 'reuniones') cargarReuniones();
    }

    P.iniciar('cronograma').then(() => {
        document.querySelectorAll('#vistas .pestana').forEach((b) => { b.onclick = () => verVista(b.dataset.vista); });
        if (new URLSearchParams(window.location.search).get('vista') === 'reuniones') verVista('reuniones');
        document.getElementById('btn-anterior').onclick = () => estado.resumen && cargar(estado.resumen.anterior);
        document.getElementById('btn-siguiente').onclick = () => estado.resumen && cargar(estado.resumen.siguiente);
        document.getElementById('btn-hoy').onclick = () => cargar('');
        // La API lleva cualquier fecha al domingo de su semana.
        document.getElementById('fecha-semana').onchange = (e) => { if (e.target.value) cargar(e.target.value); };
        cargar('');
    });
})();
</script>
