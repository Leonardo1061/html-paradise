<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Nómina · PARADISE</title>
<!--
  NÓMINA (CEO, Gerencia y Programación)
  =====================================
  El producido de todas las cuentas de Stripchat y Chaturbate, en dólares, por
  SEMANA de corte: domingo 12:00 am a sábado 11:59:59 pm (/api/nomina/estudio
  ?semana=0 la en curso, 1 la anterior… hasta 12 atrás). La API lo lee
  de cada plataforma en el momento (con caché); aquí no se guarda nada.
  Abajo, las cuentas sin «Nick en la plataforma»: sin él no hay producido.
  La pestaña solo sale si la API pone `nomina` en sus módulos.

  POR MODELO (2026-10-20): la suma de sus cuentas, el porcentaje que le toca
  (tramos, semana del cumpleaños, ajuste del CEO; nomina_porcentajes.py) y lo
  que se le paga. Solo el CEO edita: el porcentaje de cada modelo (✏️) y las
  tablas de tramos (abajo). La suma es Stripchat + Chaturbate.
-->
<link rel="manifest" href="manifest_personal.webmanifest">
<link rel="apple-touch-icon" href="iconos/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PARADISE Staff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/personal.css">
<style>
.contenido { max-width: 860px; }
.periodos { margin-bottom: 14px; }
.periodos select { width: 100%; border: 1px solid var(--borde); background: var(--panel); color: var(--texto);
        border-radius: 999px; padding: 10px 14px; font-size: 14px; font-weight: 600; }
.total { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
.total .cifra { font-size: 28px; font-weight: 700; }
.total .rotulo { font-size: 13px; color: var(--tenue); }
.fila-nomina { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0;
        border-top: 1px solid var(--borde); cursor: pointer; }
.fila-nomina:first-child { border-top: none; }
.fila-nomina .nombre { font-weight: 600; font-size: 14px; }
.fila-nomina .sub { font-size: 12px; color: var(--tenue); }
.fila-nomina .usd { font-weight: 700; font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; }
.fila-nomina .usd.error { color: var(--ambar); font-weight: 500; font-size: 12px; max-width: 180px; }
.detalle { grid-column: 1 / -1; font-size: 12.5px; color: var(--tenue); }
.detalle div { display: flex; justify-content: space-between; padding: 2px 0; font-variant-numeric: tabular-nums; }
.sin-nick { font-size: 13px; color: var(--tenue); line-height: 1.7; }
h2.seccion { font-size: 15px; margin: 22px 0 8px; }
.modelo-nomina { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0;
        border-top: 1px solid var(--borde); }
.modelo-nomina:first-child { border-top: none; }
.modelo-nomina .nombre { font-weight: 600; font-size: 14px; }
.modelo-nomina .sub { font-size: 12px; color: var(--tenue); }
.modelo-nomina .pago { text-align: right; font-variant-numeric: tabular-nums; }
.modelo-nomina .pago b { font-size: 15px; }
.modelo-nomina .pago small { display: block; font-size: 12px; color: var(--tenue); }
.chip-nomina { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
        background: var(--panel-alto); color: var(--tenue); margin: 3px 4px 0 0; }
.editar-pct { background: none; border: none; color: var(--cian); cursor: pointer; font-size: 12px; padding: 0; margin-top: 4px; }
.editor { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 8px; align-items: end; padding-top: 6px; }
.editor .campo { margin: 0; }
.tramos { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tramos td { padding: 4px; border-top: 1px solid var(--borde); }
.tramos input, #tablas .t-cumple { width: 80px; background: var(--panel-alto); border: 1px solid var(--borde);
        color: var(--texto); border-radius: 8px; padding: 5px 7px; }
.nombre-tabla { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
</style>
</head>
<body>

<main class="contenido">
    <div class="titulo-pagina">
        <h1>💵 Nómina</h1>
        <p>Producido en dólares (1 token = 0,05 USD), el porcentaje de cada modelo y lo que se le paga. Corte: sábado 11:59:59 pm. Toca una cuenta para ver el detalle.</p>
    </div>
    <div class="periodos"><select id="semana" title="Semana de corte"></select></div>
    <div id="cargando" class="cargando"><span class="girando">◌</span> Consultando las plataformas…</div>
    <div id="resultado" class="oculto">
        <div class="tarjeta total"><span class="rotulo" id="total-rotulo"></span><span class="cifra" id="total"></span></div>
        <h2 class="seccion">Por modelo · porcentaje y pago</h2>
        <div class="tarjeta" id="modelos"></div>
        <h2 class="seccion">Por cuenta</h2>
        <div class="tarjeta" id="lista"></div>
        <h2 class="seccion" id="sin-nick-titulo"></h2>
        <div class="tarjeta sin-nick" id="sin-nick"></div>
        <h2 class="seccion">Tablas de porcentajes</h2>
        <div class="tarjeta" id="tablas"></div>
    </div>
</main>

<script src="js/config.js"></script>
<script src="js/push.js"></script>
<script src="js/personal.js"></script>
<script>
(function () {
    'use strict';
    const P = window.Personal;
    const esc = P.escapar;
    const $ = (id) => document.getElementById(id);
    const dolares = (n) => '$' + Number(n || 0).toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const SEMANAS_ATRAS = 12;

    // Domingo a sábado, en la hora del teléfono (el estudio está en Colombia).
    (function llenarSemanas() {
        const hoy = new Date();
        const domingo = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - hoy.getDay());
        const corta = (d) => d.toLocaleDateString('es-CO', { day: '2-digit', month: 'short' });
        for (let i = 0; i <= SEMANAS_ATRAS; i++) {
            const inicio = new Date(domingo); inicio.setDate(domingo.getDate() - 7 * i);
            const fin = new Date(inicio); fin.setDate(inicio.getDate() + 6);
            const nombre = i === 0 ? 'Esta semana (en curso)' : i === 1 ? 'Semana anterior' : 'Hace ' + i + ' semanas';
            $('semana').insertAdjacentHTML('beforeend', '<option value="' + i + '">' + nombre + ' · ' +
                corta(inicio) + ' – ' + corta(fin) + '</option>');
        }
    })();

    function detalle(f) {
        return '<div class="detalle oculto">' + (f.detalle || []).map((d) =>
            '<div><span>' + esc(d.concepto) + ' · ' + d.tokens.toLocaleString('es-CO') + ' tk</span><span>' +
            dolares(d.usd) + '</span></div>').join('') +
            '<div><span>' + esc(f.estudio || '') + '</span><span>' + (f.tokens || 0).toLocaleString('es-CO') + ' tokens</span></div></div>';
    }

    let config = null;
    const NOMBRE_TABLA = { general: 'Paradise, Tropic e Imperio', satelites: 'Satélites' };
    const porc = (n) => Number(n || 0).toLocaleString('es-CO', { maximumFractionDigits: 2 }) + ' %';

    function textoAjuste(a) {
        if (!a || !a.modo) return '';
        const partes = [];
        if (a.modo === 'fijo') partes.push('fijo ' + porc(a.porcentaje_fijo));
        if (a.aumento) partes.push((a.aumento > 0 ? '+' : '') + porc(a.aumento));
        return '✏️ ' + partes.join(' ') + (a.motivo ? ' · ' + a.motivo : '');
    }

    function pintarModelos(modelos) {
        $('modelos').innerHTML = modelos.length ? modelos.map((m) =>
            '<div class="modelo-nomina" data-cedula="' + esc(m.cedula) + '"><div>' +
            '<div class="nombre">' + esc(m.nombre) + '</div>' +
            '<div class="sub">' + esc(m.jornada || '—') + ' · por tabla ' + porc(m.tramo) + '</div>' +
            (m.cumpleanos ? '<span class="chip-nomina">🎂 semana de cumpleaños</span>' : '') +
            (textoAjuste(m.ajuste) ? '<span class="chip-nomina">' + esc(textoAjuste(m.ajuste)) + '</span>' : '') +
            (m.cuentas_con_error ? '<span class="chip-nomina">⚠️ ' + m.cuentas_con_error + ' cuenta(s) sin dato</span>' : '') +
            (config && config.puede_editar ? '<div><button class="editar-pct">✏️ Cambiar porcentaje</button></div>' : '') +
            '</div><div class="pago"><b>' + dolares(m.a_pagar) + '</b><small>' + porc(m.porcentaje) +
            ' de ' + dolares(m.usd) + '</small></div></div>').join('')
            : '<div class="vacio">Sin producido esta semana.</div>';
        $('modelos').querySelectorAll('.editar-pct').forEach((boton) => {
            const fila = boton.closest('.modelo-nomina');
            boton.onclick = () => abrirEditor(fila, modelos.find((m) => m.cedula === fila.dataset.cedula));
        });
    }

    function abrirEditor(fila, m) {
        const abierto = fila.querySelector('.editor');
        if (abierto) { abierto.remove(); return; }
        const a = m.ajuste || {};
        fila.insertAdjacentHTML('beforeend', '<div class="editor">' +
            '<div class="campo"><label>Porcentaje</label><select class="e-modo">' +
            '<option value="tabla">Según la tabla</option><option value="fijo">Fijo</option></select></div>' +
            '<div class="campo"><label>Fijo (%)</label><input class="e-fijo" type="number" min="0" max="100" step="0.5"></div>' +
            '<div class="campo"><label>Aumento (puntos)</label><input class="e-aumento" type="number" min="-100" max="100" step="0.5"></div>' +
            '<div class="campo"><label>Motivo</label><input class="e-motivo" maxlength="200" placeholder="Publicidad…"></div>' +
            '<button class="boton-principal e-guardar">Guardar</button></div>');
        const e = (c) => fila.querySelector(c);
        e('.e-modo').value = a.modo === 'fijo' ? 'fijo' : 'tabla';
        e('.e-fijo').value = a.porcentaje_fijo != null ? a.porcentaje_fijo : '';
        e('.e-aumento').value = a.aumento || '';
        e('.e-motivo').value = a.motivo || '';
        e('.e-guardar').onclick = async () => {
            const modo = e('.e-modo').value;
            const fijo = e('.e-fijo').value.trim();
            if (modo === 'fijo' && fijo === '') { P.avisar('Escribe el porcentaje fijo.', 'malo'); return; }
            e('.e-guardar').disabled = true;
            try {
                await P.pedir('/api/nomina/porcentaje/' + encodeURIComponent(m.cedula), 'POST', {
                    modo, porcentaje_fijo: modo === 'fijo' ? Number(fijo) : null,
                    aumento: Number(e('.e-aumento').value || 0), motivo: e('.e-motivo').value });
                P.avisar('Porcentaje de ' + m.nombre + ' guardado.');
                cargar();
            } catch (error) {
                P.avisar(error.message, 'malo');
                e('.e-guardar').disabled = false;
            }
        };
    }

    function pintarTablas() {
        if (!config) { $('tablas').innerHTML = '<div class="vacio">No se pudieron leer las tablas.</div>'; return; }
        const editable = config.puede_editar;
        const celda = (valor, clase) => editable
            ? '<input type="number" min="0" step="0.01" class="' + clase + '" value="' + valor + '">' : esc(String(valor));
        $('tablas').innerHTML = ['general', 'satelites'].map((tabla) =>
            '<div style="margin-bottom:14px"><div class="nombre-tabla">' + NOMBRE_TABLA[tabla] + '</div>' +
            '<table class="tramos" data-tabla="' + tabla + '"><tr><td>Desde (USD)</td><td>Porcentaje</td></tr>' +
            config[tabla].map((t) => '<tr data-estricto="' + (t.estricto ? 1 : '') + '"><td>' +
                (t.estricto ? 'más de ' : '') + celda(t.desde, 't-desde') + '</td><td>' +
                celda(t.porcentaje, 't-pct') + ' %</td></tr>').join('') + '</table></div>').join('') +
            '<div class="sub">Semana del cumpleaños: ' + celda(config.porcentaje_cumpleanos, 't-cumple') + ' %</div>' +
            (editable ? '<button class="boton-principal" id="guardar-tablas" style="margin-top:12px">Guardar tablas</button>'
                      : '<div class="sub" style="margin-top:8px">Solo el CEO las cambia.</div>');
        if (!editable) return;
        $('guardar-tablas').onclick = async () => {
            const cuerpo = { porcentaje_cumpleanos: Number($('tablas').querySelector('.t-cumple').value) };
            $('tablas').querySelectorAll('table').forEach((t) => {
                cuerpo[t.dataset.tabla] = [...t.querySelectorAll('tr[data-estricto]')].map((tr) => ({
                    desde: Number(tr.querySelector('.t-desde').value),
                    porcentaje: Number(tr.querySelector('.t-pct').value),
                    estricto: !!tr.dataset.estricto }));
            });
            try {
                await P.pedir('/api/nomina/porcentajes', 'POST', cuerpo);
                P.avisar('Tablas guardadas.');
                config = null;
                cargar();
            } catch (error) { P.avisar(error.message, 'malo'); }
        };
    }

    function pintar(datos) {
        pintarModelos(datos.modelos || []);
        pintarTablas();
        $('total-rotulo').textContent = 'Total ' + datos.semana.etiqueta + (datos.semana.en_curso ? ' (en curso)' : '') +
            ' · ' + datos.filas.length + ' cuentas';
        $('total').textContent = dolares(datos.total_usd);
        $('lista').innerHTML = datos.filas.length ? datos.filas.map((f) =>
            '<div class="fila-nomina"><div><div class="nombre">' + esc(f.nombre) + '</div>' +
            '<div class="sub">' + esc(f.pagina) + ' · ' + esc(f.nick) + '</div></div>' +
            (f.ok ? '<div class="usd">' + dolares(f.usd) + '</div>' + detalle(f)
                  : '<div class="usd error">' + esc(f.error) + '</div>') + '</div>').join('')
            : '<div class="vacio">Ninguna cuenta tiene nick todavía.</div>';
        $('lista').querySelectorAll('.fila-nomina').forEach((fila) => {
            fila.onclick = () => { const d = fila.querySelector('.detalle'); if (d) d.classList.toggle('oculto'); };
        });
        $('sin-nick-titulo').textContent = datos.sin_nick.length
            ? 'Sin «Nick en la plataforma» (' + datos.sin_nick.length + ')' : '';
        $('sin-nick').classList.toggle('oculto', !datos.sin_nick.length);
        $('sin-nick').innerHTML = datos.sin_nick.map((f) =>
            esc(f.nombre) + ' · ' + esc(f.pagina) + ' · ' + esc(f.cedula)).join('<br>') +
            '<div style="margin-top:8px;color:var(--apagado)">Se llena en la Admin, en las redes de la modelo.</div>';
    }

    async function cargar() {
        $('cargando').classList.remove('oculto');
        $('resultado').classList.add('oculto');
        try {
            if (!config) config = await P.pedir('/api/nomina/porcentajes').catch(() => null);
            const datos = await P.pedir('/api/nomina/estudio?semana=' + $('semana').value);
            pintar(datos);
            $('resultado').classList.remove('oculto');
        } catch (e) {
            P.avisar(e.message, 'malo');
        } finally {
            $('cargando').classList.add('oculto');
        }
    }

    $('semana').onchange = cargar;

    P.iniciar('nomina').then(cargar);
})();
</script>
</body>
</html>
