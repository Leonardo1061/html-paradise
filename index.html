<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Acceso · PARADISE</title>

<!--
  ACCESO DE LAS MODELOS · POR CÉDULA
  ==================================
  Antes había que elegir jornada, buscarse en una lista de cien nombres y
  escribir la contraseña. Ahora es cédula + contraseña, igual que el programa
  de escritorio desde la 2.2.0:

    · La cédula es el ID del documento en `Modelos`: el login es UNA lectura
      directa, y dos modelos con nombres parecidos dejan de ser un problema.
    · [CONTRATO] La contraseña inicial son los ÚLTIMOS 4 DÍGITOS de la cédula.
      Se puede cambiar desde PERFIL, y vale para las dos aplicaciones.
    · Esta página ya NO pide la lista de modelos: el sitio es público y no
      tiene por qué publicar quién trabaja en el estudio.
-->

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconos/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PARADISE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --fondo: #0a0a0b;
    --panel: #141318;
    --panel-alto: #1b1a22;
    --borde: #2a2932;
    --texto: #f4f4f5;
    --tenue: #9b9ba3;
    --apagado: #6b6b73;
    --degradado: linear-gradient(90deg, #d946ef 0%, #8b5cf6 100%);
}
* { box-sizing: border-box; }
body {
    margin: 0; min-height: 100vh; background: var(--fondo); color: var(--texto);
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; padding: 22px;
    background-image: radial-gradient(circle at 20% 0%, rgba(139, 92, 246, .18) 0%, rgba(10,10,11,0) 55%);
}
button { font-family: inherit; cursor: pointer; }

.caja {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--borde); border-radius: 22px; padding: 30px 24px 26px;
    box-shadow: 0 26px 60px rgba(0, 0, 0, .55);
}
.marca {
    width: 54px; height: 54px; border-radius: 17px; margin: 0 auto 16px;
    display: grid; place-items: center; background: var(--degradado);
    font-size: 25px; font-weight: 700; color: #fff;
    box-shadow: 0 12px 26px rgba(168, 85, 247, .4);
}
h1 { margin: 0; font-size: 21px; font-weight: 700; text-align: center; }
.sub { margin: 5px 0 24px; font-size: 12px; color: var(--tenue); text-align: center;
       letter-spacing: 1.6px; text-transform: uppercase; }

.campo { margin-bottom: 15px; }
.campo label { display: block; font-size: 12px; color: var(--tenue); margin-bottom: 7px; }
.campo input {
    width: 100%; background: var(--panel-alto); border: 1px solid var(--borde);
    border-radius: 13px; padding: 14px; color: var(--texto); font-size: 16px;
    font-family: inherit; outline: none; transition: border-color .15s;
}
.campo input:focus { border-color: #8b5cf6; }
.campo .ayuda { font-size: 11.5px; color: var(--apagado); margin-top: 7px; line-height: 1.45; }

.entrar {
    width: 100%; background: var(--degradado); border: 0; color: #fff; font-weight: 600;
    border-radius: 13px; padding: 15px; font-size: 15px; margin-top: 8px;
    box-shadow: 0 10px 26px rgba(168, 85, 247, .32);
}
.entrar:active { transform: scale(.985); }
.entrar:disabled { opacity: .6; cursor: default; box-shadow: none; }

.error {
    display: none; margin-top: 16px; font-size: 13.5px; line-height: 1.45;
    background: rgba(239, 68, 68, .1); border: 1px solid rgba(239, 68, 68, .45);
    border-radius: 12px; padding: 12px 13px; color: #fecaca;
}

.personal { display: block; text-align: center; margin-top: 18px; font-size: 12.5px; color: var(--tenue); }

.velo {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .78); display: none;
    align-items: center; justify-content: center; padding: 22px; z-index: 60;
}
.modal {
    background: var(--panel); border: 1px solid var(--borde); border-radius: 20px;
    padding: 24px 22px; width: 100%; max-width: 360px; text-align: center;
}
.modal .icono { font-size: 34px; }
.modal h3 { margin: 10px 0 10px; font-size: 18px; }
.modal p { font-size: 14px; color: var(--tenue); line-height: 1.55; margin: 0 0 18px; }
</style>
</head>

<body>

<div class="caja">
    <div class="marca">P</div>
    <h1>Acceso modelos</h1>
    <p class="sub">Paradise</p>

    <form id="formulario">
        <div class="campo">
            <label for="cedula">Tu número de cédula</label>
            <input id="cedula" inputmode="numeric" autocomplete="username"
                   placeholder="Sin puntos ni espacios" required>
        </div>

        <div class="campo">
            <label for="password">Contraseña</label>
            <input id="password" type="password" autocomplete="current-password"
                   placeholder="••••" required>
            <div class="ayuda">Si es tu primera vez, son los <b>últimos 4 dígitos
                de tu cédula</b>. Luego puedes cambiarla desde Perfil.</div>
        </div>

        <button type="submit" class="entrar" id="btn-entrar">Ingresar</button>
        <div class="error" id="error"></div>
    </form>
    <a class="personal" href="personal.html">¿Eres del equipo administrativo? Entra aquí</a>
</div>

<!-- La jornada que pidió se llenó: se le dice antes de entrar. -->
<div class="velo" id="velo-aviso">
    <div class="modal">
        <div class="icono">🔔</div>
        <h3>Aviso importante</h3>
        <p id="texto-aviso"></p>
        <button class="entrar" onclick="continuar()">Entendido, continuar</button>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/push.js"></script>
<script>
const API_URL = PARADISE.API_URL;

function continuar() {
    window.location.href = "panel.html";
}

document.getElementById('formulario').addEventListener('submit', async function (evento) {
    evento.preventDefault();

    const cedula = document.getElementById('cedula').value.trim();
    const password = document.getElementById('password').value.trim();
    const boton = document.getElementById('btn-entrar');
    const error = document.getElementById('error');

    error.style.display = 'none';
    boton.disabled = true;
    boton.textContent = "Verificando…";

    try {
        const respuesta = await fetch(`${API_URL}/api/acceso/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cedula: cedula, password: password })
        });
        const datos = await respuesta.json();

        if (respuesta.ok) {
            // `modelo_actual` lo siguen usando turnos.html y reuniones.html,
            // que trabajan por NOMBRE. El token es lo que exige la API para el
            // plan de trabajo y el panel; la cédula no se guarda aquí.
            localStorage.setItem('modelo_actual', datos.nombre);
            localStorage.setItem('jornada_actual', datos.jornada);
            localStorage.setItem('token_sesion', datos.token || '');
            if (datos.password_por_defecto) localStorage.setItem('password_por_defecto', '1');
            else localStorage.removeItem('password_por_defecto');

            boton.textContent = "¡Bienvenida!";

            if (datos.aviso) {
                document.getElementById('texto-aviso').textContent = datos.aviso;
                document.getElementById('velo-aviso').style.display = 'flex';
                return;
            }
            setTimeout(continuar, 600);
        } else {
            error.textContent = datos.detail || "No se pudo iniciar sesión.";
            error.style.display = 'block';
            boton.disabled = false;
            boton.textContent = "Ingresar";
        }
    } catch (fallo) {
        error.textContent = "No hay conexión con el servidor. Revisa tus datos y vuelve a intentarlo.";
        error.style.display = 'block';
        boton.disabled = false;
        boton.textContent = "Ingresar";
    }
});
</script>
</body>
</html>
