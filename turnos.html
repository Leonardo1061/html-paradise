<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Turnos</title>
    <style>
        :root {
            /* --- Paleta: amarillo sobre negro --- */
            --amarillo: #FFD500;
            --amarillo-oscuro: #E6A700;
            --negro: #0B0B0B;
            --negro-suave: #161616;
            --negro-panel: #1C1C1C;
            --gris-linea: #2E2E2E;
            --bg-body: #0B0B0B;
            --card-bg: #141414;

            /* --- Texto sobre fondo oscuro --- */
            --texto: #ECECEC;
            --texto-tenue: #A8A8A8;

            /* --- Colores CON SIGNIFICADO: no se tocan --- */
            --verde: #4CAF50;      /* libre */
            --morado: #9C27B0;     /* ocupado por otra */
            --naranja: #FF9800;    /* tu turno confirmado */
            --fijo: #03A9F4;       /* tu cuarto fijo */
            --satelite: #00BFA5;   /* modelo satélite */
            --extra: #EC407A;      /* supernumeraria: cubre un hueco */
            --rojo: #F44336;
            --espera: #FFFFFF;     /* lista de espera: BLANCO */
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: var(--bg-body); color: var(--texto); padding-bottom: 110px; }
        textarea, input, select { background-color: #101010; color: var(--texto); }
        textarea::placeholder { color: #6E6E6E; }

        /* ===================== CABECERA ===================== */
        header {
            background-color: var(--negro); color: #fff; padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
            border-bottom: 4px solid var(--amarillo);
        }
        .header-info h1 { font-size: 1.05rem; margin-bottom: 2px; }
        .header-info p { font-size: 0.75rem; color: var(--amarillo); font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }

        .btn-entregar {
            background: var(--amarillo); color: #000; border: none;
            padding: 9px 13px; border-radius: 6px; font-weight: bold;
            cursor: pointer; display: none; font-size: 0.85rem;
        }
        .btn-campana {
            position: relative; background: var(--negro-suave); color: var(--amarillo);
            border: 2px solid #3A3A3A; width: 42px; height: 40px; border-radius: 6px;
            font-size: 1.15rem; cursor: pointer; line-height: 1;
        }
        .btn-campana.tiene-avisos { border-color: var(--amarillo); animation: latido 1.6s infinite; }
        @keyframes latido { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }
        .punto-campana {
            position: absolute; top: -5px; right: -5px; background: var(--rojo);
            color: #fff; border-radius: 50%; min-width: 19px; height: 19px;
            font-size: 0.7rem; font-weight: bold; display: none;
            align-items: center; justify-content: center; padding: 0 4px;
        }

        .container { max-width: 100%; padding: 12px; overflow-x: hidden; }
        .card { background: var(--card-bg); border: 1px solid #242424; border-radius: 10px; padding: 15px; margin-bottom: 18px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--amarillo); padding-bottom: 10px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .card-header h2 { color: var(--texto); }
        .fecha-hoy { font-weight: bold; color: var(--texto); font-size: 0.95rem; }
        .dropdown-jornada { font-size: 0.85rem; font-weight: bold; color: var(--negro); border: 2px solid var(--negro); background: var(--amarillo); padding: 7px 10px; border-radius: 6px; outline: none; cursor: pointer; text-transform: uppercase; }

        .btn-amarillo { background-color: var(--amarillo); color: #000; border: 2px solid var(--amarillo-oscuro); padding: 10px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.88rem; }
        .btn-negro { background-color: var(--negro); color: var(--amarillo); border: 2px solid var(--negro); padding: 10px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.88rem; }
        .btn-amarillo:active, .btn-negro:active { transform: scale(0.98); }

        /* ===================== CUARTOS DE HOY ===================== */
        .room-row { display: grid; grid-template-columns: 38px 1fr 96px; border: 1px solid var(--gris-linea); border-bottom: none; align-items: center; }
        .room-row:last-child { border-bottom: 1px solid var(--gris-linea); }
        .room-row > div { padding: 10px 5px; text-align: center; font-size: 0.85rem; border-right: 1px solid var(--gris-linea); }
        .r-num { font-weight: bold; background-color: var(--negro); color: var(--amarillo); }
        .r-name { text-align: left !important; text-transform: uppercase; font-weight: bold; color: var(--texto); }
        .r-state { font-weight: bold; font-size: 0.75rem; }
        .estado-ocupada { background-color: #3A1416; color: #FF8A80; }
        .estado-salida { background-color: #3A2D0E; color: #FFD180; }
        .estado-disponible { background-color: #13301A; color: #A5D6A7; cursor: pointer; }
        .estado-neutro { background-color: #1E1E1E; color: #8A8A8A; }
        .estado-elegida { background-color: var(--amarillo); color: #000; cursor: pointer; }

        /* ===================== LEYENDA ===================== */
        .leyenda { display: flex; gap: 12px; font-size: 0.72rem; justify-content: center; flex-wrap: wrap; background: #000; border: 1px solid #2A2A2A; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; }
        .leyenda span { display: flex; align-items: center; gap: 5px; color: #fff; }
        .caja-color { width: 13px; height: 13px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.35); }

        /* ===================== PRE-AGENDAMIENTO ===================== */
        #pre-agendamiento { background-color: #1A1708; padding: 15px; border-radius: 10px; margin-bottom: 18px; border: 2px solid var(--amarillo); }
        #pre-agendamiento h3 { color: var(--amarillo); margin-bottom: 8px; font-size: 1.05rem; }
        .aviso-doble { background: #000; border: 1px solid #333; color: var(--texto); padding: 12px; border-radius: 8px; font-size: 0.88rem; line-height: 1.5; margin-bottom: 14px; }
        .aviso-doble b { color: var(--amarillo); }

        .bloque-jornada { border: 2px solid var(--gris-linea); border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #121212; }
        .bloque-jornada.oficial { border-color: var(--verde); }
        .bloque-jornada.espera { border-color: #BDBDBD; border-style: dashed; }
        .titulo-jornada { font-weight: bold; font-size: 0.95rem; color: var(--texto); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
        .etiqueta-oficial { background: var(--verde); color: #fff; font-size: 0.68rem; padding: 3px 8px; border-radius: 20px; }
        .etiqueta-espera { background: #757575; color: #fff; font-size: 0.68rem; padding: 3px 8px; border-radius: 20px; }
        .nota-jornada { font-size: 0.76rem; color: var(--texto-tenue); margin-bottom: 10px; line-height: 1.45; }
        .nota-espera { color: var(--amarillo); font-weight: bold; }

        .grid-dias { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 7px; }
        .dia-btn { padding: 9px 4px; text-align: center; border-radius: 8px; font-weight: bold; font-size: 0.8rem; cursor: pointer; user-select: none; transition: 0.15s; }
        .dia-asiste { background-color: var(--amarillo); color: #000; border: 2px solid var(--amarillo-oscuro); }
        .dia-falta { background-color: #1A1A1A; color: #8A8A8A; border: 2px dashed #3C3C3C; }

        /* ===================== GRILLAS SEMANALES ===================== */
        .titulo-grilla { margin: 18px 0 8px; font-size: 1rem; font-weight: bold; color: #fff; background: #000; padding: 8px 12px; border-radius: 6px; border-left: 6px solid var(--amarillo); }
        .semana-scroll { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 8px; }
        .dia-columna { min-width: 142px; border: 1px solid var(--gris-linea); border-radius: 8px; overflow: hidden; background-color: #101010; }
        .dia-titulo { background-color: var(--negro); color: var(--amarillo); text-align: center; padding: 8px; font-weight: bold; font-size: 0.85rem; }
        .turno-bloque { padding: 8px 5px; border-bottom: 1px solid var(--gris-linea); font-size: 0.72rem; text-align: center; color: #fff; font-weight: bold; line-height: 1.25; }

        .bg-morado { background-color: var(--morado); }
        .bg-verde { background-color: var(--verde); cursor: pointer; }
        .bg-mia { background-color: var(--naranja); cursor: pointer; border: 2px solid #E65100; }
        .bg-fija { background-color: var(--fijo); cursor: pointer; border: 2px solid #0288D1; }
        .bg-vacio { background-color: #1E1E1E; color: #7F7F7F; }
        /* Las satélites trabajan desde su casa: color propio para no
           confundirlas con las del estudio. Además llevan el icono 🛰, que
           se lee aunque el color no se distinga bien en un móvil al sol. */
        .bg-satelite { background-color: var(--satelite); color: #00211D; }
        /* Supernumeraria: no tiene jornada propia, está cubriendo un hueco.
           Mismo criterio que con las satélites: color propio MÁS icono, para
           que se distinga aunque la pantalla esté lavada por el sol. */
        .bg-extra { background-color: var(--extra); color: #2B0716; }
        .bg-elegida { background-color: var(--amarillo); color: #000; border: 2px solid var(--negro); cursor: pointer; }
        /* LISTA DE ESPERA = BLANCO */
        .bg-espera { background-color: var(--espera); color: #444; border: 2px dashed #9E9E9E; }
        .bg-espera-otra { background-color: var(--espera); color: #9E9E9E; border: 1px dashed #D5D5D5; }

        /* ===================== BARRA DE GUARDADO ===================== */
        #barra-guardar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--negro); padding: 12px 16px; z-index: 200;
            display: none; box-shadow: 0 -4px 14px rgba(0,0,0,0.3);
            border-top: 3px solid var(--amarillo);
        }
        #barra-guardar.visible { display: block; }
        #btn-guardar { width: 100%; background: var(--amarillo); color: #000; border: none; padding: 15px; border-radius: 8px; font-size: 1.02rem; font-weight: bold; cursor: pointer; }
        #btn-guardar:disabled { background: #7A7A7A; color: #DDD; cursor: wait; }
        #texto-pendiente { color: var(--amarillo); font-size: 0.75rem; text-align: center; margin-bottom: 8px; font-weight: bold; }

        .btn-salir { width: 100%; background-color: var(--negro); color: #fff; padding: 14px; border: 2px solid #444; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 15px; }

        /* ===================== AVISOS ===================== */
        #toast { visibility: hidden; min-width: 260px; max-width: 90%; background-color: var(--negro); color: var(--amarillo); text-align: center; border-radius: 8px; padding: 15px; position: fixed; z-index: 9999; left: 50%; bottom: 100px; transform: translateX(-50%); font-weight: bold; opacity: 0; transition: opacity 0.35s, bottom 0.35s; border: 2px solid var(--amarillo); }
        #toast.show { visibility: visible; opacity: 1; bottom: 120px; }
        #toast.exito { background-color: var(--verde); color: #fff; border-color: #2E7D32; }
        #toast.error { background-color: var(--rojo); color: #fff; border-color: #B71C1C; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: #161616; color: var(--texto); padding: 20px; border-radius: 12px; width: 100%; max-width: 380px; text-align: center; border: 1px solid #2E2E2E; border-top: 6px solid var(--amarillo); }
        .modal-content h3 { margin-bottom: 12px; color: var(--texto); }
        .btn-adjuntar { display: block; background: #2C2C2C; color: var(--amarillo); border: 2px dashed #4A4A4A; padding: 11px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; margin-bottom: 10px; }
        #vista-foto { margin-bottom: 12px; }
        #vista-foto img { max-width: 100%; max-height: 160px; border-radius: 6px; border: 2px solid var(--amarillo); }
        #vista-foto .quitar { display: block; width: 100%; margin-top: 6px; background: none; border: none; color: var(--texto-tenue); font-size: 0.78rem; text-decoration: underline; cursor: pointer; }
        .btn-modal-rojo { background: var(--rojo); color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .btn-modal-gris { background: #2C2C2C; color: var(--texto); border: 1px solid #3C3C3C; padding: 12px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; }
        .lista-avisos { text-align: left; max-height: 300px; overflow-y: auto; }
        .aviso-item { background: #1A1708; border-left: 5px solid var(--amarillo); color: var(--texto); padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 0.86rem; }

        /* Selector de jornada del status ya publicado */
        #barra-jornada-actual { display: none; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
        #barra-jornada-actual .etiqueta { font-size: 0.8rem; color: var(--texto-tenue); font-weight: bold; }
    </style>
</head>
<body>

    <div id="toast">Guardado</div>

    <header>
        <div class="header-info">
            <h1 id="lbl-nombre">Cargando...</h1>
            <p id="lbl-jornada">Jornada</p>
        </div>
        <div class="header-actions">
            <!-- Plan de trabajo (plan.html). Es el MISMO plan que ve el
                 programa de escritorio: los dos escriben el mismo documento. -->
            <button class="btn-entregar" id="btn-plan" onclick="window.location.href='plan.html'"
                    style="background:linear-gradient(90deg,#d946ef,#8b5cf6); color:#fff; border:0;">
                🗓️ Mi plan
            </button>
            <button class="btn-entregar" id="btn-entregar" onclick="marcarEntregaCuarto()">Entregar Cuarto</button>
            <button class="btn-campana" id="btn-campana" onclick="abrirAvisos()">
                🔔<span class="punto-campana" id="punto-campana">0</span>
            </button>
        </div>
    </header>

    <div class="container">
        <!-- ================= CUARTOS DE HOY ================= -->
        <div class="card">
            <div class="card-header">
                <span class="fecha-hoy" id="fecha-actual">Cargando...</span>
                <select id="filtro-jornada-hoy" class="dropdown-jornada" onchange="renderizarCuartosHoy()">
                    <option value="Mañana">ROOM MAÑANA (7 AM - 1 PM)</option>
                    <option value="Tarde">ROOM TARDE (1 PM - 8 PM)</option>
                    <option value="Noche">ROOM NOCHE (8 PM - 7 AM)</option>
                </select>
            </div>
            <div id="tabla-rooms"><p style="text-align:center;">Conectando...</p></div>
        </div>

        <!-- ================= STATUS SEMANAL ================= -->
        <div class="card">
            <div class="card-header">
                <h2 style="font-size:1.2rem; margin:0;">
                    STATUS SEMANAL
                    <span id="rango-fechas" style="font-size:0.9rem; color:#666; font-weight:normal;"></span>
                </h2>
                <button id="btn-toggle-semana" class="btn-amarillo" style="display:none;" onclick="alternarSemana()">📅 AGENDAR PRÓXIMA SEMANA</button>
            </div>

            <div class="leyenda">
                <span><div class="caja-color" style="background:var(--verde);"></div> Libre</span>
                <span><div class="caja-color" style="background:var(--morado);"></div> Ocupado</span>
                <span><div class="caja-color" style="background:var(--naranja);"></div> Tu turno</span>
                <span><div class="caja-color" style="background:var(--fijo);"></div> Fijo</span>
                <span><div class="caja-color" style="background:#FFF;"></div> En espera</span>
                <span><div class="caja-color" style="background:var(--satelite);"></div> 🛰 Satélite</span>
                <span><div class="caja-color" style="background:var(--extra);"></div> ➕ Supernumeraria</span>
            </div>

            <!-- Selector de jornada del status YA PUBLICADO.
                 Solo se ve en la semana en curso: en el pre-agendamiento se
                 muestran las tres jornadas a la vez, porque ahí sí hay que
                 elegir en cuáles marcar. -->
            <div id="barra-jornada-actual">
                <span class="etiqueta">Jornada que estás viendo:</span>
                <select id="sel-jornada-actual" class="dropdown-jornada" onchange="cambiarJornadaActual()">
                    <option value="Mañana">☀️ MAÑANA (7 AM - 1 PM)</option>
                    <option value="Tarde">🌇 TARDE (1 PM - 8 PM)</option>
                    <option value="Noche">🌙 NOCHE (8 PM - 7 AM)</option>
                </select>
            </div>

            <!-- PANEL DE PRE-AGENDAMIENTO -->
            <div id="pre-agendamiento" style="display:none;">
                <h3>📅 Programación de la próxima semana</h3>
                <div class="aviso-doble" id="aviso-perfil"></div>
                <div id="bloques-jornadas"></div>
                <div id="caja-motivo" style="margin-top:12px;">
                    <textarea id="pre-motivo" style="width:100%; padding:10px; border:2px solid var(--gris-linea); border-radius:6px;" placeholder="Observaciones para el monitor (opcional)" rows="2"></textarea>
                </div>
            </div>

            <div id="grillas"></div>

            <button class="btn-salir" onclick="cerrarSesion()">🚪 SALIR</button>
        </div>
    </div>

    <!-- BARRA DE GUARDADO -->
    <div id="barra-guardar">
        <div id="texto-pendiente"></div>
        <button id="btn-guardar" onclick="guardarCambios()">Guardar</button>
    </div>

    <!-- MODAL LIBERAR -->
    <div class="modal-overlay" id="modal-liberar">
        <div class="modal-content">
            <h3>⚠️ Liberar turno</h3>
            <p id="texto-liberar" style="margin-bottom:12px;"></p>
            <textarea id="motivo-liberacion" style="width:100%; padding:10px; margin-bottom:10px; border:2px solid var(--gris-linea); border-radius:6px;" placeholder="Motivo (obligatorio)" rows="2"></textarea>

            <label for="foto-liberacion" class="btn-adjuntar">📎 Adjuntar foto (opcional)</label>
            <input type="file" id="foto-liberacion" accept="image/*" style="display:none;" onchange="prepararFoto(this)">
            <div id="vista-foto"></div>

            <button class="btn-modal-rojo" onclick="confirmarLiberacion()">Liberar y enviar</button>
            <button class="btn-modal-gris" onclick="cerrarModal('modal-liberar')">Cancelar</button>
        </div>
    </div>

    <!-- MODAL AVISOS -->
    <div class="modal-overlay" id="modal-avisos">
        <div class="modal-content">
            <h3>🔔 Avisos</h3>
            <div class="lista-avisos" id="lista-avisos"></div>
            <button class="btn-modal-gris" style="margin-top:10px;" onclick="cerrarAvisos()">Entendido</button>
        </div>
    </div>

<script src="js/config.js"></script>
<script>
/* =========================================================================
   PARADISE — Gestión de turnos de las modelos
   -------------------------------------------------------------------------
   CAMBIOS DE FONDO FRENTE A LA VERSIÓN ANTERIOR

   1. SE ACABÓ EL AUTO-GUARDADO. Antes cualquier toque disparaba un POST
      medio segundo después. Ahora todo se acumula y se envía con un botón
      cuyo texto dice EXACTAMENTE qué se va a guardar.

   2. DÍAS AL REVÉS. Antes se marcaban los días que NO venía y se asumía el
      resto. Ahora arranca ausente y marca los días que SÍ viene: un olvido
      ya no la compromete a una semana entera.

   3. LAS TRES JORNADAS, SIEMPRE. Se acabó el selector de una sola jornada.

   4. DOBLE JORNADA CON PAREJA FIJA. La elige el monitor, no la modelo. En
      esas dos tiene el cupo asegurado; en la tercera va a lista de espera.

   5. LISTA DE ESPERA EN BLANCO, con el número de oficiales que faltan por
      programarse y la hora exacta de confirmación.
   ========================================================================= */

// Las direcciones viven en js/config.js: un solo sitio para las dos apps.
// URL_LOGIN se calcula sola, así que probar en local ya no te echa al
// servidor de producción a mitad de prueba.
const API_URL = PARADISE.API_URL;
const URL_LOGIN = PARADISE.URL_LOGIN;

const modeloActual = localStorage.getItem('modelo_actual') || "";
const jornadaBase = localStorage.getItem('jornada_actual') || "Mañana";
if (!modeloActual) window.location.href = URL_LOGIN;

const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const JORNADAS = ['Mañana', 'Tarde', 'Noche'];
const TOTAL_CUARTOS = 12;
const HORA_CONFIRMACION = "12:00:01 PM del sábado";

document.getElementById('lbl-nombre').textContent = modeloActual;
document.getElementById('lbl-jornada').textContent = `Jornada: ${jornadaBase}`;

/* ---------------------------------------------------------------- Estado */
let cuartosFisicos = [];
let semanaActual = {}, semanaProxima = {};
let perfiles = {}, faltantes = {}, conteoOficiales = {}, cuposLibres = {};
let seleccionesPrevias = {};
let viendoProxima = false;
let perfilCargado = false;

// Jornada que se muestra en el status YA PUBLICADO. Arranca en la que
// corresponde a la hora actual: a las 10 AM se ve la mañana, a las 2 PM la
// tarde. Se puede cambiar con el desplegable.
let jornadaVista = "Mañana";

// Días marcados por jornada. Por defecto NADA: está ausente.
let diasMarcados = { "Mañana": [], "Tarde": [], "Noche": [] };

/* Cambios pendientes de guardar. Tres tipos, con su etiqueta. */
let pendiente = {
    cuarto: null,        // { room, estado, jornada }
    statusActual: [],    // [{ dia, jornada, room }]
    programacion: false  // true si tocó los días
};

/* ------------------------------------------------------------ Utilidades */
const hoy = new Date();
document.getElementById('fecha-actual').textContent =
    hoy.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });

const nombreDiaHoy = DIAS[hoy.getDay()];
let diaIso = hoy.getDay(); if (diaIso === 0) diaIso = 7;
const horaH = hoy.getHours();

let jornadaDetectada = "Noche";
if (horaH >= 7 && horaH < 13) jornadaDetectada = "Mañana";
else if (horaH >= 13 && horaH < 20) jornadaDetectada = "Tarde";
document.getElementById('filtro-jornada-hoy').value = jornadaDetectada;
jornadaVista = jornadaDetectada;
document.getElementById('sel-jornada-actual').value = jornadaDetectada;

function actualizarRangoFechas() {
    const meses = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
    const fmt = (d) => `${String(d.getDate()).padStart(2,'0')}/${meses[d.getMonth()]}`;
    let ref = new Date(hoy);
    if (viendoProxima) ref.setDate(hoy.getDate() + 7);
    let inicio = new Date(ref); inicio.setDate(ref.getDate() - ref.getDay());
    let fin = new Date(inicio); fin.setDate(inicio.getDate() + 6);
    document.getElementById('rango-fechas').textContent = `${fmt(inicio)} - ${fmt(fin)}`;
}
actualizarRangoFechas();

/* ============================================================ PERFIL
   Qué jornadas tiene aseguradas esta modelo. Es el corazón de la regla
   nueva: la pareja la pone el monitor y aquí solo se lee.
   ================================================================= */
function miPerfil() { return perfiles[modeloActual] || {}; }

function jornadasOficiales() {
    const p = miPerfil();
    if (Array.isArray(p.jornadas_oficiales) && p.jornadas_oficiales.length) return p.jornadas_oficiales;
    const tipo = p.doble_jornada_tipo || "";
    if (tipo) return tipo.split('-').filter(j => JORNADAS.includes(j));
    if (p.doble_jornada) return [...JORNADAS];
    return JORNADAS.includes(p.jornada) ? [p.jornada] : [];
}

function esOficialEn(jornada) { return jornadasOficiales().includes(jornada); }

/* Una satélite trabaja desde su casa: no ocupa cuarto del estudio por
   derecho propio. Se pinta de otro color para no confundirla con las de
   dentro, y lleva el icono 🛰 por si el color no se distingue bien en un
   móvil a pleno sol. */
function esSatelite(nombre) {
    return (perfiles[nombre] || {}).jornada === "Satelites";
}

/* Una supernumeraria cubre huecos: no tiene jornada propia, así que en
   cualquiera de las tres va a lista de espera. Es distinta de una satélite
   —esa trabaja desde su casa— y por eso lleva su propio color. */
function esSupernumeraria(nombre) {
    return (perfiles[nombre] || {}).jornada === "Supernumerario";
}

function textoPerfil() {
    const p = miPerfil();
    const tipo = p.doble_jornada_tipo || "";
    const cierre = `Puedes marcar también en otra jornada, pero solo sabrás si quedaste a partir de las <b>${HORA_CONFIRMACION}</b>.`;

    if (tipo) {
        const [a, b] = tipo.split('-');
        let extra = "";
        if (tipo === "Noche-Mañana") {
            extra = " Recuerda que la <b>noche</b> de un día empalma con la <b>mañana del día siguiente</b>: al marcar una noche se marca sola la mañana siguiente.";
        }
        return `Eres de <b>doble jornada ${a} y ${b}</b>, lo cual te asegura un cupo en esas dos jornadas.${extra} ${cierre}`;
    }
    if (JORNADAS.includes(p.jornada)) {
        return `Tu jornada oficial es <b>${p.jornada}</b>: ahí tienes el cupo asegurado. ${cierre}`;
    }
    if (p.jornada === "Supernumerario") {
        return `Eres <b>supernumeraria</b>: cubres los huecos del estudio, así que no tienes una jornada propia con cupo asegurado. Puedes programarte en las tres y entrarás en los cupos que queden libres. ${cierre}`;
    }
    return `Eres <b>Satélite</b>: trabajas desde tu casa, así que no tienes cupo asegurado en el estudio, pero puedes programarte en cualquier jornada. Entrarás si queda algún cupo sin usar. ${cierre}`;
}

    }

}

function renderizarBloquesJornadas() {
    document.getElementById('aviso-perfil').innerHTML = textoPerfil();
    const cont = document.getElementById('bloques-jornadas');
    cont.innerHTML = '';

    JORNADAS.forEach(jornada => {
        const oficial = esOficialEn(jornada);
        const totalOficiales = conteoOficiales[jornada] || 0;
        const pendientesJor = faltantes[jornada] || 0;

        let nota;
        if (oficial) {
            nota = `<div class="nota-jornada">Cupo asegurado. Marca los días que vendrás.</div>`;
        } else {
            nota = `<div class="nota-jornada nota-espera">
                        Quedarás en <b>lista de espera</b> (color blanco).
                        La jornada ${jornada} tiene <b>${totalOficiales} modelos oficiales</b>
                        y <b>${pendientesJor}</b> aún no se han programado.
                        Tu cupo se confirma el ${HORA_CONFIRMACION}.
                    </div>`;
        }

        let dias = '';
        DIAS.forEach(dia => {
            const viene = diasMarcados[jornada].includes(dia);
            dias += `<div class="dia-btn ${viene ? 'dia-asiste' : 'dia-falta'}"
                          onclick="alternarDia('${jornada}','${dia}')">
                        ${dia}<br><small>${viene ? 'VENDRÉ' : 'AUSENTE'}</small>
                     </div>`;
        });

        cont.innerHTML += `
            <div class="bloque-jornada ${oficial ? 'oficial' : 'espera'}">
                <div class="titulo-jornada">
                    <span>Jornada ${jornada}</span>
                    <span class="${oficial ? 'etiqueta-oficial' : 'etiqueta-espera'}">
                        ${oficial ? '✔ CUPO ASEGURADO' : '⏳ LISTA DE ESPERA'}
                    </span>
                </div>
                ${nota}
                <div class="grid-dias">${dias}</div>
            </div>`;
    });
}

function alternarDia(jornada, dia) {
    const lista = diasMarcados[jornada];
    const i = lista.indexOf(dia);
    if (i >= 0) lista.splice(i, 1); else lista.push(dia);

    // "Noche-Mañana" cruza el día: la noche del lunes empalma con la mañana
    // del MARTES. Se marca sola, y la modelo puede quitarla si no le sirve.
    if ((miPerfil().doble_jornada_tipo || "") === "Noche-Mañana" && jornada === "Noche") {
        const siguiente = DIAS[(DIAS.indexOf(dia) + 1) % 7];
        const manana = diasMarcados["Mañana"];
        const j = manana.indexOf(siguiente);
        if (i >= 0) { if (j >= 0) manana.splice(j, 1); }
        else if (j < 0) { manana.push(siguiente); }
    }

    pendiente.programacion = true;
    renderizarBloquesJornadas();
    renderizarGrillas();
    actualizarBarraGuardar();
}

/* ====================================================== CUARTOS DE HOY */
function renderizarCuartosHoy() {
    const jorSel = document.getElementById('filtro-jornada-hoy').value;
    const cont = document.getElementById('tabla-rooms');
    cont.innerHTML = '';

    if (jorSel === jornadaDetectada) {
        cuartosFisicos.forEach(c => {
            const elegida = pendiente.cuarto && pendiente.cuarto.room === c.room && pendiente.cuarto.estado === "OCUPADA";
            let clase, texto, click = "";

            if (elegida) {
                clase = "estado-elegida"; texto = "✓ SIN GUARDAR";
                click = `onclick="quitarCuartoPendiente()"`;
            } else if (c.estado === "OCUPADA") {
                clase = "estado-ocupada"; texto = c.estado;
            } else if (c.estado === "DE SALIDA") {
                clase = "estado-salida"; texto = c.estado;
            } else if (c.estado === "DISPONIBLE") {
                clase = "estado-disponible"; texto = "✋ TOMAR";
                click = `onclick="marcarTomaCuarto(${c.room}, '${jorSel}')"`;
            } else {
                clase = "estado-neutro"; texto = c.estado;
            }

            const nombreVisible = elegida ? modeloActual : (c.nombre || "");
            cont.innerHTML += `<div class="room-row"><div class="r-num">${c.room}</div><div class="r-name">${nombreVisible}</div><div class="r-state ${clase}" ${click}>${texto}</div></div>`;
        });
    } else {
        for (let i = 1; i <= TOTAL_CUARTOS; i++) {
            const raw = (semanaActual[nombreDiaHoy] && semanaActual[nombreDiaHoy][jorSel] && semanaActual[nombreDiaHoy][jorSel][String(i)]) || "";
            const nom = raw.split("::")[0];
            cont.innerHTML += `<div class="room-row"><div class="r-num">${i}</div><div class="r-name" style="color:${nom ? '#444' : '#AAA'}">${nom || "---"}</div><div class="r-state ${nom ? "estado-ocupada" : "estado-neutro"}">${nom ? "PROGRAMADA" : "CUPO"}</div></div>`;
        }
    }
}

function marcarTomaCuarto(room, jornada) {
    pendiente.cuarto = { room: room, estado: "OCUPADA", jornada: jornada };
    renderizarCuartosHoy();
    actualizarBarraGuardar();
}

function quitarCuartoPendiente() {
    pendiente.cuarto = null;
    renderizarCuartosHoy();
    actualizarBarraGuardar();
}

function marcarEntregaCuarto() {
    const mio = cuartosFisicos.find(c => c.nombre === modeloActual && (c.estado === "OCUPADA" || c.estado === "DE SALIDA"));
    if (!mio) return mostrarToast("No tienes ningún cuarto a tu nombre.", "error");
    pendiente.cuarto = { room: mio.room, estado: "DISPONIBLE", jornada: document.getElementById('filtro-jornada-hoy').value };

/* ======================================================= GRILLAS SEMANA */
function hayCupoElegido(dia, jornada, room) {
    return pendiente.statusActual.some(c => c.dia === dia && c.jornada === jornada && c.room === room);
}

function generarGrilla(bd, jornada, modo) {
    let html = '<div class="semana-scroll">';
    DIAS.forEach(dia => {
        html += `<div class="dia-columna"><div class="dia-titulo">${dia}</div>`;
        for (let i = 1; i <= TOTAL_CUARTOS; i++) {
            const raw = (bd[dia] && bd[dia][jornada] && bd[dia][jornada][String(i)]) || "";
            const ocupante = raw.split("::")[0];
            const enEspera = raw.includes("::PENDIENTE");
            const perfil = perfiles[ocupante] || {};
            const esFija = String(perfil.cuarto_fijo) === String(i);
            const prefijo = esFija ? `R${i}: ` : "";

            if (hayCupoElegido(dia, jornada, i)) {
                html += `<div class="turno-bloque bg-elegida" onclick="quitarCupoElegido('${dia}','${jornada}',${i})">✓ SIN GUARDAR</div>`;
                continue;
            }

            if (ocupante === modeloActual) {
                if (enEspera) {
                    html += `<div class="turno-bloque bg-espera">TÚ (en espera)</div>`;
                } else if (esFija) {
                    html += `<div class="turno-bloque bg-fija" onclick="abrirModalLiberar('${dia}','${jornada}',${i})">${prefijo}TÚ (FIJA)</div>`;
                } else {
                    html += `<div class="turno-bloque bg-mia" onclick="abrirModalLiberar('${dia}','${jornada}',${i})">TÚ</div>`;
                }
            } else if (ocupante) {
                const satelite = esSatelite(ocupante);
                const extra = esSupernumeraria(ocupante);
                const icono = satelite ? "🛰 " : (extra ? "➕ " : "");
                const nombreVisible = icono + ocupante.toUpperCase();
                if (enEspera) {
                    html += `<div class="turno-bloque bg-espera-otra">${nombreVisible} (espera)</div>`;
                } else if (esFija) {
                    html += `<div class="turno-bloque bg-fija">${prefijo}${nombreVisible}</div>`;
                } else if (satelite) {
                    html += `<div class="turno-bloque bg-satelite">${nombreVisible}</div>`;
                } else if (extra) {
                    html += `<div class="turno-bloque bg-extra">${nombreVisible}</div>`;
                } else {
                    html += `<div class="turno-bloque bg-morado">${nombreVisible}</div>`;
                }
            } else {
                if (modo === "proxima") {
                    html += `<div class="turno-bloque bg-vacio">VACÍO</div>`;
                } else {
                    html += `<div class="turno-bloque bg-verde" onclick="marcarCupoActual('${dia}','${jornada}',${i})">➕ DISPONIBLE</div>`;
                }
            }
        }
        html += `</div>`;
    });
    return html + '</div>';
}

function cambiarJornadaActual() {
    jornadaVista = document.getElementById('sel-jornada-actual').value;
    renderizarGrillas();
}

function renderizarGrillas() {
    const cont = document.getElementById('grillas');
    const barra = document.getElementById('barra-jornada-actual');

    if (viendoProxima) {
        // PRE-AGENDAMIENTO: las tres jornadas, con su etiqueta. Aquí sí hace
        // falta saber en cuáles tiene el cupo asegurado, porque está
        // decidiendo dónde marcar.
        barra.style.display = 'none';
        let html = '';
        JORNADAS.forEach(jornada => {
            const etiqueta = esOficialEn(jornada) ? '✔ cupo asegurado' : '⏳ lista de espera';
            html += `<div class="titulo-grilla">${jornada.toUpperCase()} <span style="font-weight:normal; font-size:0.8rem; color:#CFCFCF;">· ${etiqueta}</span></div>`;
            html += generarGrilla(semanaProxima, jornada, "proxima");
        });
        cont.innerHTML = html;
        return;
    }

    // SEMANA EN CURSO: una sola jornada, la de la hora actual, con el
    // desplegable para mirar las otras dos. Sin etiqueta de "cupo asegurado":
    // esta semana ya está publicada, lo que hay es lo que hay.
    barra.style.display = 'flex';
    cont.innerHTML = `<div class="titulo-grilla">${jornadaVista.toUpperCase()}</div>`
                   + generarGrilla(semanaActual, jornadaVista, "actual");
}

function marcarCupoActual(dia, jornada, room) {
    if (viendoProxima) return;
    pendiente.statusActual = pendiente.statusActual.filter(c => !(c.dia === dia && c.jornada === jornada));
    pendiente.statusActual.push({ dia, jornada, room });
    renderizarGrillas();
    actualizarBarraGuardar();
}

function quitarCupoElegido(dia, jornada, room) {
    pendiente.statusActual = pendiente.statusActual.filter(c => !(c.dia === dia && c.jornada === jornada && c.room === room));
    renderizarGrillas();
    actualizarBarraGuardar();
}

function renderizarTodo() {
    if (viendoProxima) renderizarBloquesJornadas();
    renderizarCuartosHoy();
    renderizarGrillas();
    actualizarBarraGuardar();
}

/* ================================================== BARRA DE GUARDADO
   El texto del botón dice exactamente qué se va a guardar. Era lo que
   pedía el estudio: antes se guardaba solo y nadie sabía cuándo.
   ==================================================================== */
function etiquetaGuardar() {
    const tipos = [];
    if (pendiente.cuarto) tipos.push("cuarto");
    if (pendiente.statusActual.length) tipos.push("status");
    if (pendiente.programacion) tipos.push("programacion");

    if (tipos.length === 0) return null;
    if (tipos.length > 1) return { boton: "Guardar todos los cambios", nota: "Tienes varios cambios sin guardar." };
    if (tipos[0] === "cuarto") {
        const entrega = pendiente.cuarto.estado === "DISPONIBLE";
        return {
            boton: "Guardar Cambios en Cuarto",
            nota: entrega ? `Vas a entregar el cuarto ${pendiente.cuarto.room}.`
                          : `Vas a tomar el cuarto ${pendiente.cuarto.room} de hoy.`
        };
    }
    if (tipos[0] === "status") {
        return { boton: "Guardar Cambios en Status Actual",
                 nota: `${pendiente.statusActual.length} cupo(s) de la semana publicada.` };
    }
    return { boton: "Guardar Programación", nota: "Programación de la próxima semana." };
}

function actualizarBarraGuardar() {
    const barra = document.getElementById('barra-guardar');
    const info = etiquetaGuardar();
    if (!info) { barra.classList.remove('visible'); return; }
    document.getElementById('btn-guardar').textContent = info.boton;
    document.getElementById('texto-pendiente').textContent = info.nota;
    barra.classList.add('visible');
}

async function guardarCambios() {
    const boton = document.getElementById('btn-guardar');
    boton.disabled = true;
    const textoOriginal = boton.textContent;
    boton.textContent = "Guardando...";

    try {
        if (pendiente.cuarto) {
            const r = await fetch(`${API_URL}/api/cuartos/actualizar`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    room: pendiente.cuarto.room,
                    nombre: pendiente.cuarto.estado === "OCUPADA" ? modeloActual : "",
                    estado: pendiente.cuarto.estado,
                    jornada: pendiente.cuarto.jornada
                })
            });
            if (!r.ok) throw new Error("No se pudo guardar el cuarto.");
        }

        for (const cupo of pendiente.statusActual) {
            const r = await fetch(`${API_URL}/api/semana/tomar_cupo`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre: modeloActual, dia: cupo.dia, jornada: cupo.jornada, room: cupo.room, tipo_semana: "actual" })
            });
            if (!r.ok) {
                const detalle = await r.json().catch(() => ({}));
                throw new Error(detalle.detail || "Un cupo ya no estaba libre.");
            }
        }

        if (pendiente.programacion) {
            const r = await fetch(`${API_URL}/api/semana/pre_agendar`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre: modeloActual, dias: diasMarcados, motivo: document.getElementById('pre-motivo').value })
            });
            if (!r.ok) throw new Error("La fase de programación está cerrada.");
        }

        pendiente = { cuarto: null, statusActual: [], programacion: false };
        mostrarToast("✅ ¡Cambios guardados correctamente!", "exito");
        await cargarDatos();
    } catch (e) {
        mostrarToast("⚠️ " + e.message, "error");
        boton.textContent = textoOriginal;
    } finally {
        boton.disabled = false;
    }
}

/* ============================================================== AVISOS
   La campana NO necesita ninguna colección nueva ni ningún proceso en
   segundo plano: si la modelo está en espera en una jornada y ahí aparece
   un cupo vacío, eso ES el aviso. Se calcula con los datos que la página
   ya descarga cada minuto.
   ==================================================================== */
let avisos = [];

function calcularAvisos() {
    avisos = [];
    const vistos = JSON.parse(localStorage.getItem('avisos_vistos') || '[]');

    [["proxima", semanaProxima], ["actual", semanaActual]].forEach(([modo, bd]) => {
        JORNADAS.forEach(jornada => {
            DIAS.forEach(dia => {
                const cuartos = (bd[dia] && bd[dia][jornada]) || {};
                let enEspera = false, libres = 0;
                Object.values(cuartos).forEach(valor => {
                    if (valor === "") libres++;
                    else if (valor.includes("::PENDIENTE") && valor.split("::")[0] === modeloActual) enEspera = true;
                });
                if (enEspera && libres > 0) {
                    const clave = `${modo}|${jornada}|${dia}|${libres}`;
                    avisos.push({
                        clave: clave,
                        nuevo: !vistos.includes(clave),
                        texto: `Se desocupó un cupo en <b>${jornada}</b> del <b>${dia}</b> (${modo === "proxima" ? "próxima semana" : "semana actual"}). Estás en lista de espera para esa jornada.`
                    });
                }
            });
        });
    });

    const nuevos = avisos.filter(a => a.nuevo).length;
    const punto = document.getElementById('punto-campana');
    const campana = document.getElementById('btn-campana');
    if (nuevos > 0) {
        punto.textContent = nuevos;
        punto.style.display = 'flex';
        campana.classList.add('tiene-avisos');
    } else {
        punto.style.display = 'none';
        campana.classList.remove('tiene-avisos');
    }
}

function abrirAvisos() {
    const lista = document.getElementById('lista-avisos');
    if (!avisos.length) {
        lista.innerHTML = `<div class="aviso-item">No tienes avisos. Si quedas en lista de espera y se desocupa un cupo, aparecerá aquí.</div>`;
    } else {
        lista.innerHTML = avisos.map(a => `<div class="aviso-item">${a.texto}</div>`).join('');
    }
    document.getElementById('modal-avisos').style.display = 'flex';
}

function cerrarAvisos() {
    localStorage.setItem('avisos_vistos', JSON.stringify(avisos.map(a => a.clave)));
    cerrarModal('modal-avisos');
    calcularAvisos();
}

/* ============================================================ LIBERAR */
let turnoALiberar = null;
let fotoAdjunta = "";        // base64 de la foto, vacío si no adjuntó nada

const LADO_MAXIMO_FOTO = 800;   // px del lado mayor
const CALIDAD_FOTO = 0.7;       // JPEG

/* La foto se comprime EN EL TELÉFONO antes de subirla. Una cámara de móvil
   saca 4 MB por foto y un documento de Firestore no puede pasar de 1 MiB; a
   800 px y calidad 0.7 una incapacidad se lee perfectamente y pesa ~120 KB. */
function prepararFoto(entrada) {
    const archivo = entrada.files && entrada.files[0];
    if (!archivo) return;

    if (!archivo.type.startsWith("image/")) {
        mostrarToast("Solo se pueden adjuntar imágenes.", "error");
        entrada.value = "";
        return;
    }

    const lector = new FileReader();
    lector.onload = function (evento) {
        const imagen = new Image();
        imagen.onload = function () {
            const escala = Math.min(1, LADO_MAXIMO_FOTO / Math.max(imagen.width, imagen.height));
            const lienzo = document.createElement('canvas');
            lienzo.width = Math.round(imagen.width * escala);
            lienzo.height = Math.round(imagen.height * escala);
            lienzo.getContext('2d').drawImage(imagen, 0, 0, lienzo.width, lienzo.height);

            fotoAdjunta = lienzo.toDataURL('image/jpeg', CALIDAD_FOTO);
            const kb = Math.round(fotoAdjunta.length / 1024);
            document.getElementById('vista-foto').innerHTML =
                `<img src="${fotoAdjunta}" alt="adjunto">
                 <button class="quitar" onclick="quitarFoto()">Quitar la foto (${kb} KB)</button>`;
        };
        imagen.onerror = function () {
            mostrarToast("No se pudo leer esa imagen.", "error");
            quitarFoto();
        };
        imagen.src = evento.target.result;
    };
    lector.readAsDataURL(archivo);
}

function quitarFoto() {
    fotoAdjunta = "";
    document.getElementById('vista-foto').innerHTML = "";
    document.getElementById('foto-liberacion').value = "";
}

function abrirModalLiberar(dia, jornada, room) {
    turnoALiberar = { dia, jornada, room };
    document.getElementById('texto-liberar').textContent = `Vas a liberar tu cupo del ${dia} en la jornada ${jornada} (cuarto ${room}).`;
    document.getElementById('modal-liberar').style.display = 'flex';
}

async function confirmarLiberacion() {
    const motivo = document.getElementById('motivo-liberacion').value.trim();
    if (!motivo) return mostrarToast("Escribe el motivo.", "error");
    try {
        await fetch(`${API_URL}/api/semana/liberar`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre: modeloActual, dia: turnoALiberar.dia, jornada: turnoALiberar.jornada, room: turnoALiberar.room, motivo: motivo, foto_base64: fotoAdjunta, tipo_semana: viendoProxima ? "proxima" : "actual" })
        });
        document.getElementById('motivo-liberacion').value = "";
        quitarFoto();
        cerrarModal('modal-liberar');
        mostrarToast("Turno liberado.", "exito");
        await cargarDatos();
    } catch (e) {
        mostrarToast("No se pudo liberar el turno.", "error");
    }
}

/* ============================================================== DATOS */
async function cargarDatos() {
    try {
        const rC = await fetch(`${API_URL}/api/cuartos?t=${Date.now()}`, { cache: 'no-store' });
        const jC = await rC.json();
        cuartosFisicos = Object.keys(jC.cuartos).map(k => ({
            room: parseInt(k), nombre: jC.cuartos[k].nombre, estado: jC.cuartos[k].estado
        })).sort((a, b) => a.room - b.room);

        const tieneCuarto = cuartosFisicos.some(c => c.nombre === modeloActual && (c.estado === "OCUPADA" || c.estado === "DE SALIDA"));
        document.getElementById('btn-entregar').style.display = tieneCuarto ? 'block' : 'none';

        const rS = await fetch(`${API_URL}/api/semana?t=${Date.now()}`, { cache: 'no-store' });
        const jS = await rS.json();
        semanaActual = jS.semana_actual || {};
        semanaProxima = jS.proxima_semana || {};
        perfiles = jS.perfiles || {};
        faltantes = jS.faltantes || {};
        conteoOficiales = jS.conteo_oficiales || {};
        cuposLibres = jS.cupos_libres || {};
        seleccionesPrevias = jS.selecciones_previas || {};

        if (!perfilCargado) {
            const previa = seleccionesPrevias[modeloActual];
            if (previa && previa.dias) {
                JORNADAS.forEach(j => { diasMarcados[j] = (previa.dias[j] || []).slice(); });
                if (previa.motivo) document.getElementById('pre-motivo').value = previa.motivo;
            }
            perfilCargado = true;
        }

        calcularAvisos();
        renderizarTodo();
    } catch (e) {
        console.error("Error conectando:", e);
        mostrarToast("Sin conexión con el servidor.", "error");
    }
}

// Se refresca cada minuto, pero NUNCA se pisan los cambios sin guardar:
// los pendientes viven en `pendiente` y se repintan encima de lo que llegue.
cargarDatos();
setInterval(cargarDatos, 60000);
</script>
