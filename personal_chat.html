<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Chat personal · PARADISE</title>

<!--
  CHAT DEL PERSONAL ADMINISTRATIVO
  ================================
  La misma conversación que el chat del escritorio del monitor
  (Chats/{cedula}/Mensajes), con sus mismas reglas: Soporte para los
  monitores de jornada, el chat de cada rol para quien tiene ese rol, y
  Tropic Studio solo para quien le toca. Arriba, el chat privado uno a uno
  con cada persona del personal (aparte, solo lo leen los dos; es el mismo
  del botón 🔒 Personal del escritorio). El componente vive en
  js/chat_personal.js; las burbujas usan css/chat.css, como el de las modelos.
-->

<link rel="manifest" href="manifest_personal.webmanifest">
<link rel="apple-touch-icon" href="iconos/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PARADISE Staff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/personal.css">
<link rel="stylesheet" href="css/chat.css">

<style>
body { padding-bottom: 120px; }
.buscador {
    flex: 1; min-width: 160px; background: var(--panel-alto); border: 1px solid var(--borde);
    border-radius: 11px; padding: 9px 12px; color: var(--texto); font-size: 14px; outline: none;
}
.buscador:focus { border-color: var(--cian); }
.lista-conv { padding: 4px 14px; }
.fila.conv { cursor: pointer; }
.punto { width: 9px; height: 9px; border-radius: 50%; flex: none; background: transparent; }
.punto.encendido { background: var(--rojo); box-shadow: 0 0 0 3px rgba(239, 68, 68, .18); }

/* La fila del personal (chat privado uno a uno). */
.equipo { margin: 0 0 14px; }
.equipo-rotulo { font-size: 12px; color: var(--tenue); margin-bottom: 8px; }
.fila-equipo {
    display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
}
.equipo-vacio { font-size: 13px; color: var(--apagado); padding: 6px 0; }
.persona {
    flex: none; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: none; border: 0; color: var(--texto); cursor: pointer; padding: 2px 0; font-family: inherit;
}
.persona .avatar {
    position: relative; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
    background: var(--panel-alto); border: 1px solid var(--borde); font-size: 15px; font-weight: 600;
}
.persona:hover .avatar, .persona.activa .avatar { border-color: var(--cian); }
.persona .globo { position: absolute; top: -3px; right: -5px; }
.persona .nombre-persona {
    font-size: 11.5px; max-width: 64px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.cabeza-conv {
    display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 6;
    background: var(--fondo); padding: 4px 0 10px;
}
.quien-conv .nombre { font-size: 16px; font-weight: 600; }
.quien-conv .jornada { font-size: 12px; color: var(--tenue); }

/* La conversación lleva su caja de texto encima de la barra de abajo. */
.chat-lista { padding-bottom: 130px; }
.fila-canal {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; color: var(--tenue);
    background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; padding: 6px 10px;
}
.fila-canal select {
    flex: 1; background: var(--panel-alto); border: 1px solid var(--borde); color: var(--texto);
    border-radius: 9px; padding: 6px 8px; font-size: 13px;
}
.chat-barra .chat-enviar { background: var(--degradado); color: #fff; }
</style>
</head>

<body>

<main class="contenido" id="chat"></main>

<script src="js/config.js"></script>
<script src="js/push.js"></script>
<script src="js/personal.js"></script>
<script src="js/adjuntos.js"></script>
<script src="js/chat_personal.js"></script>
<script>
Personal.iniciar('chat').then(() => ChatPersonal.montar(document.getElementById('chat')));
</script>
</body>
</html>
