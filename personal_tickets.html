<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Mis tickets · PARADISE</title>

<!--
  MIS TICKETS (solo el CEO)
  =========================
  El historial de los 🎫 TICKET CEO que le han mandado las modelos desde su
  portal: los 15 más recientes y «Cargar más» para los anteriores
  (/api/personal/tickets?desde=). Los abiertos se responden aquí mismo, igual
  que en la campana. La pestaña solo sale si la API pone `tickets` en sus
  módulos, y la API solo lo hace con el rol CEO.
-->

<link rel="manifest" href="manifest_personal.webmanifest">
<link rel="apple-touch-icon" href="iconos/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PARADISE Staff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/personal.css">
</head>

<body>

<main class="contenido">
    <div class="titulo-pagina" style="display:flex;gap:12px;align-items:flex-start">
        <div style="flex:1">
            <h1>🎫 Mis tickets</h1>
            <p id="subtitulo">Lo que te han escrito las modelos, lo más reciente arriba.</p>
        </div>
        <!-- El triángulo despliega el filtro por tipo; la tuerca añade, modifica
             o elimina los tipos de solicitud (solo el CEO entra aquí). -->
        <div class="acciones-tickets">
            <select id="filtro-tipo" class="filtro-tipo" title="Filtrar por tipo de solicitud">
                <option value="">TIPOS DE SOLICITUD</option>
            </select>
            <button class="redondo tuerca-tipos" id="tipos" title="Añadir, modificar o eliminar tipos de solicitud">⚙</button>
        </div>
    </div>
    <!-- Todos los tickets de una persona: lo que se le ha respondido (2026-11-01). -->
    <div class="filtro-personas">
        <label for="buscar-persona">Persona</label>
        <div class="fila-persona">
            <input id="buscar-persona" type="search" placeholder="Buscar modelo o personal…" autocomplete="off">
            <button class="redondo oculto" id="quitar-persona" title="Quitar el filtro de persona">✕</button>
        </div>
        <div id="opciones-persona" class="opciones-persona oculto"></div>
    </div>
    <div id="cargando" class="cargando"><span class="girando">◌</span> Cargando…</div>
    <div id="lista"></div>
    <div class="botones oculto" id="pie" style="margin-top:12px">
        <button class="boton-secundario" id="mas">Cargar más</button>
    </div>
</main>

<script src="js/config.js"></script>
<script src="js/push.js"></script>
<script src="js/personal.js"></script>
<script>
(function () {
    'use strict';
    const P = window.Personal;
    const $ = (id) => document.getElementById(id);
    let cargados = 0;
    let persona = '';
    let personas = { modelos: [], personal: [], total: 0 };
    const sinTildes = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

    async function cargar(reiniciar) {
        if (reiniciar) cargados = 0;
        $('mas').disabled = true;
        try {
            const datos = await P.pedir('/api/personal/tickets?desde=' + cargados +
                                        '&tipo=' + encodeURIComponent($('filtro-tipo').value) +
                                        '&persona=' + encodeURIComponent(persona));
            personas = datos.personas || personas;
            $('cargando').classList.add('oculto');
            if (reiniciar) $('lista').innerHTML = '';
            (datos.tickets || []).forEach((t) => {
                $('lista').appendChild(P.tarjetaTarea(t, true, () => { cargar(true); P.revisarTareas(true); }));
            });
            cargados += (datos.tickets || []).length;
            if (!datos.total) $('lista').innerHTML = '<div class="vacio">' + (persona || $('filtro-tipo').value
                ? 'No hay tickets con ese filtro.' : 'Todavía no te ha llegado ningún ticket.') + '</div>';
            $('subtitulo').textContent = datos.total
                ? 'Viendo ' + cargados + ' de ' + datos.total +
                  (persona ? ' de ' + persona + ' (' + personas.total + ' en total)' : '') + ', lo más reciente arriba.'
                : 'Lo que te han escrito las modelos, lo más reciente arriba.';
            $('pie').classList.toggle('oculto', !datos.hay_mas);
        } catch (error) {
            $('cargando').innerHTML = P.escapar(error.message);
        }
        $('mas').disabled = false;
    }

    $('mas').onclick = () => cargar(false);

    function elegirPersona(nombre) {
        persona = nombre;
        const buscar = $('buscar-persona');
        buscar.value = nombre;
        buscar.readOnly = !!nombre;
        buscar.classList.toggle('elegida', !!nombre);
        $('quitar-persona').classList.toggle('oculto', !nombre);
        $('opciones-persona').classList.add('oculto');
        cargar(true);
    }

    function pintarOpciones() {
        const caja = $('opciones-persona');
        const filtro = sinTildes($('buscar-persona').value.trim());
        if (persona) { caja.classList.add('oculto'); return; }
        const grupo = (titulo, lista) => {
            const filas = lista.filter((p) => !filtro || sinTildes(p.nombre).indexOf(filtro) >= 0);
            return filas.length ? '<div class="grupo-persona">' + titulo + '</div>' + filas.map((p) =>
                '<button type="button" class="opcion-persona" data-nombre="' + P.escapar(p.nombre) + '"><span>' +
                P.escapar(p.nombre) + '</span><small>' + p.cuantos + (p.cuantos === 1 ? ' ticket' : ' tickets') +
                '</small></button>').join('') : '';
        };
        const html = grupo('Modelos', personas.modelos) + grupo('Personal', personas.personal);
        caja.innerHTML = html || '<div class="vacio">Nadie con ese nombre tiene tickets.</div>';
        caja.classList.remove('oculto');
        caja.querySelectorAll('.opcion-persona').forEach((b) => {
            b.onclick = () => elegirPersona(b.dataset.nombre);
        });
    }
    $('buscar-persona').onfocus = pintarOpciones;
    $('buscar-persona').oninput = pintarOpciones;
    $('quitar-persona').onclick = () => elegirPersona('');
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.filtro-personas')) $('opciones-persona').classList.add('oculto');
    });
    async function cargarTipos() {
        try {
            const datos = await P.pedir('/api/personal/tickets/tipos');
            const elegido = $('filtro-tipo').value;
            $('filtro-tipo').innerHTML = '<option value="">TIPOS DE SOLICITUD</option>' +
                (datos.tipos || []).map((t) => '<option>' + P.escapar(t) + '</option>').join('');
            $('filtro-tipo').value = (datos.tipos || []).indexOf(elegido) >= 0 ? elegido : '';
        } catch (e) { /* sin red: queda «todos» */ }
    }
    $('filtro-tipo').onchange = () => {
        $('filtro-tipo').classList.toggle('activo', !!$('filtro-tipo').value);
        cargar(true);
    };
    $('tipos').onclick = () => P.abrirTiposSolicitud(() => { cargarTipos(); cargar(true); });
    cargarTipos();
    P.iniciar('tickets').then(() => cargar(true));
})();
</script>
</body>
</html>
