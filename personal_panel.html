<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Inicio personal · PARADISE</title>

<!--
  INICIO DEL PERSONAL ADMINISTRATIVO
  ==================================
  Lo que le toca hoy a quien ha entrado: sus tareas (la campana 🔔), las
  sesiones de fotos del día y cómo están los cuartos. Los chats que esperan
  respuesta se ven en CHAT (aquí solo el globo de la barra). Cada número sale de la API (/api/personal/resumen y
  /api/personal/chat/conversaciones) con las reglas del escritorio: a cada
  uno le salen solo los chats y las modelos que su rol le deja ver.

  ＋ CREAR MODELO (2026-10-13): todo el personal da de alta una modelo con
  solo cédula y jornada (POST /api/personal/modelos). Queda con datos
  pendientes: entra a la web con su cédula y los últimos 4 dígitos y llena
  «📝 Actualiza tus datos». Las jornadas salen de /yo (`jornadas_crear`):
  Tropic Studio solo para quien ve Tropic.
-->
<style>
.cabeza-inicio { display: flex; align-items: flex-start; gap: 12px; }
.cabeza-inicio .titulo-pagina { flex: 1; min-width: 0; }
.cabeza-inicio .boton-crear { flex: none; margin-top: 4px; }
.resultado-alta { text-align: center; padding: 6px 0 4px; }
.resultado-alta .grande { font-size: 40px; }
.resultado-alta p { margin: 8px 0 0; font-size: 14px; line-height: 1.5; }
.resultado-alta .clave { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
</style>

<link rel="manifest" href="manifest_personal.webmanifest">
<link rel="apple-touch-icon" href="iconos/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PARADISE Staff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/personal.css">
</head>

<body>

<main class="contenido">
    <div class="cabeza-inicio">
        <div class="titulo-pagina">
            <h1 id="saludo">Hola</h1>
            <p id="subtitulo">Esto es lo que tienes hoy.</p>
        </div>
        <button class="boton-secundario boton-crear oculto" id="btn-crear-modelo">＋ Crear modelo</button>
    </div>
    <div id="cargando" class="cargando"><span class="girando">◌</span> Cargando…</div>
    <div id="tablero" class="oculto">
        <div class="rejilla" id="datos"></div>
        <div class="seccion tarjeta oculto" id="sec-actividades"><h2>🗓️ Próximas actividades</h2><div id="lista-actividades"></div></div>
        <div class="seccion tarjeta" id="sec-tareas"><h2>🔔 Tus tareas</h2><div id="lista-tareas"></div></div>
        <div class="seccion tarjeta oculto" id="sec-fotos"><h2>📷 Fotos de hoy</h2><div id="lista-fotos"></div></div>
    </div>
</main>

<script src="js/config.js"></script>
<script src="js/push.js"></script>
<script src="js/personal.js"></script>
<script>
(function () {
    'use strict';
    const P = window.Personal;
    const $ = (id) => document.getElementById(id);
    const esc = P.escapar;

    function dato(rotulo, cifra, pie, alPulsar) {
        const caja = document.createElement('div');
        caja.className = 'tarjeta dato' + (alPulsar ? ' clic' : '');
        caja.innerHTML = '<div class="rotulo">' + esc(rotulo) + '</div><div class="cifra">' + esc(cifra) +
            '</div><div class="pie">' + esc(pie || '') + '</div>';
        if (alPulsar) caja.onclick = alPulsar;
        return caja;
    }

    function pintarTareas(tareas) {
        const lista = $('lista-tareas');
        if (!tareas.length) { lista.innerHTML = '<div class="vacio">No tienes tareas pendientes. 🎉</div>'; return; }
        lista.innerHTML = tareas.slice(0, 5).map((t) =>
            '<div class="fila"><div class="principal"><div class="linea1">' + esc(t.titulo) + '</div>' +
            '<div class="linea2">De ' + esc(t.creada_por) + (t.creada ? ' · ' + esc(t.creada) : '') + '</div></div>' +
            '<div class="lado"><span class="pildora ' + (t.prioridad === 'Urgente' ? 'urgente' : t.prioridad === 'Alta' ? 'alta' : '') + '">' +
            esc(t.prioridad) + '</span></div></div>').join('') +
            '<div class="botones" style="margin-top:10px"><button class="boton-secundario" id="ver-tareas">Abrir la campana</button></div>';
        $('ver-tareas').onclick = P.abrirCampana;
    }

    // ＋ CREAR MODELO: solo cédula y jornada; ella llena el resto en la web.
    function abrirCrearModelo(jornadas, tipos) {
        const capa = document.createElement('div');
        capa.className = 'capa-conversacion';
        capa.innerHTML = '<div class="velo"></div><div class="hoja">' +
            '<div class="hoja-cabecera"><h3>＋ Crear modelo</h3><button class="cerrar" title="Cerrar">✕</button></div>' +
            '<div class="hoja-cuerpo"></div></div>';
        document.getElementById('capas-personal').appendChild(capa);
        const cuerpo = capa.querySelector('.hoja-cuerpo');
        const cerrar = () => capa.remove();
        capa.querySelector('.velo').onclick = cerrar;
        capa.querySelector('.cerrar').onclick = cerrar;

        function formulario() {
            cuerpo.innerHTML =
                '<div class="campo"><label>Tipo de documento *</label><select class="c-tipo">' +
                    tipos.map((t) => '<option>' + esc(t) + '</option>').join('') + '</select></div>' +
                '<div class="campo"><label>Número de documento *</label>' +
                    '<input class="c-cedula" inputmode="numeric" autocomplete="off" placeholder="Solo números"></div>' +
                '<div class="campo"><label>Jornada *</label><select class="c-jornada">' +
                    '<option value="">Elige la jornada</option>' +
                    jornadas.map((j) => '<option>' + esc(j) + '</option>').join('') + '</select></div>' +
                '<div style="margin-bottom:14px;font-size:12px;color:var(--tenue);line-height:1.5">Con eso basta. Ella entra a la web con su cédula ' +
                    'y los últimos 4 dígitos, y ahí llena sus nombres, apellidos, correo, celular y contraseña.</div>' +
                '<button class="boton-principal c-crear">Crear modelo</button>';
            const cedula = cuerpo.querySelector('.c-cedula');
            const jornada = cuerpo.querySelector('.c-jornada');
            const tipo = cuerpo.querySelector('.c-tipo');
            cedula.focus();
            cuerpo.querySelector('.c-crear').onclick = async (e) => {
                const limpia = cedula.value.replace(/\D/g, '');
                if (!limpia) { P.avisar('Escribe el número de documento.', 'malo'); cedula.focus(); return; }
                if (!jornada.value) { P.avisar('Elige la jornada.', 'malo'); jornada.focus(); return; }
                if (!confirm('¿' + tipo.value + ' ' + limpia + ' está bien escrito?\n\n' +
                             'Es el ID de la modelo y no se puede cambiar después.')) return;
                e.target.disabled = true;
                try {
                    const r = await P.pedir('/api/personal/modelos', 'POST',
                                            { cedula: limpia, jornada: jornada.value, tipo_documento: tipo.value });
                    resultado(r);
                } catch (error) {
                    P.avisar(error.message, 'malo');
                    e.target.disabled = false;
                }
            };
        }

        function resultado(r) {
            cuerpo.innerHTML = '<div class="resultado-alta"><div class="grande">✅</div>' +
                '<p><b>Modelo ' + esc(r.cedula) + '</b> creada en ' + esc(r.jornada) + '.</p>' +
                '<p>Ya puede entrar a la web con su cédula y esta contraseña:</p>' +
                '<p class="clave">' + esc(r.password) + '</p>' +
                '<p style="font-size:12px;color:var(--tenue)">Al entrar llena sus datos, y ahí se le crea su carpeta de Drive.</p></div>' +
                '<div class="botones" style="margin-top:16px;display:flex;gap:8px">' +
                '<button class="boton-secundario c-otra" style="flex:1">Crear otra</button>' +
                '<button class="boton-principal c-listo" style="flex:1">Listo</button></div>';
            cuerpo.querySelector('.c-otra').onclick = formulario;
            cuerpo.querySelector('.c-listo').onclick = cerrar;
        }

        formulario();
    }

    P.iniciar('inicio').then(async (yo) => {
        const jornadasCrear = yo.jornadas_crear || [];
        // Una API vieja no manda los tipos: solo cédula de ciudadanía.
        const tiposDocumento = yo.tipos_documento || ['Cédula de ciudadanía'];
        if (jornadasCrear.length) {
            $('btn-crear-modelo').classList.remove('oculto');
            $('btn-crear-modelo').onclick = () => abrirCrearModelo(jornadasCrear, tiposDocumento);
        }
        // La campana llega por su lado (personal.js): se escucha desde ya.
        document.addEventListener('personal:tareas', (e) => pintarTareas(e.detail || []));
        // Las actividades del cronograma que le tocan (capacitaciones, reuniones).
        document.addEventListener('personal:actividades', (e) => {
            const lista = (e.detail || []).slice(0, 6);
            $('sec-actividades').classList.toggle('oculto', !lista.length);
            $('lista-actividades').innerHTML = '';
            lista.forEach((a) => $('lista-actividades').appendChild(P.tarjetaActividad(a)));
        });
        $('saludo').textContent = 'Hola, ' + (yo.monitor || '').split(' ')[0];
        $('subtitulo').textContent = (yo.texto_roles || 'Sin rol') +
            (yo.jornada && yo.jornada !== 'Todas' ? ' · Jornada ' + yo.jornada : '');
        const modulos = yo.modulos || [];
        let resumen, chats = null, privado = null;
        try {
            [resumen, chats, privado] = await Promise.all([
                P.pedir('/api/personal/resumen'),
                modulos.indexOf('chat') >= 0
                    ? P.pedir('/api/personal/chat/conversaciones?limite=150').catch(() => null)
                    : Promise.resolve(null),
                modulos.indexOf('chat') >= 0
                    ? P.pedir('/api/personal/privado').catch(() => null)
                    : Promise.resolve(null),
            ]);
        } catch (error) {
            $('cargando').innerHTML = esc(error.message);
            return;
        }
        $('cargando').classList.add('oculto');
        $('tablero').classList.remove('oculto');
        const datos = $('datos');

        datos.appendChild(dato('Tareas abiertas', resumen.tareas.abiertas,
            resumen.tareas.urgentes ? resumen.tareas.urgentes + ' urgente(s)' :
            resumen.tareas.sin_leer ? resumen.tareas.sin_leer + ' en la campana' : 'Al día', P.abrirCampana));

        // Los chats sin responder viven en CHAT; aquí solo se enciende su globo.
        // ... y suma los chats privados del personal con algo sin leer.
        if (chats || privado) {
            P.globoChat((chats ? (chats.conversaciones || []).filter((c) => c.esperando).length : 0) +
                        (privado ? privado.sin_leer || 0 : 0));
        }

        if (resumen.fotografia) {
            const hoy = resumen.fotografia.hoy || [];
            datos.appendChild(dato('Fotos hoy', hoy.length,
                hoy.length ? 'Primera: ' + hoy[0].rango : 'Sin sesiones',
                () => { window.location.href = 'personal_fotografia.html'; }));
            $('sec-fotos').classList.remove('oculto');
            $('lista-fotos').innerHTML = hoy.length ? hoy.map((s) =>
                '<div class="fila"><div class="principal"><div class="linea1">' + esc(s.nombre || s.asunto || 'Reservado') + '</div>' +
                '<div class="linea2">' + esc(s.asunto) + '</div></div>' +
                '<div class="lado">' + esc(s.rango) + '<br><span class="pildora ' + (s.estado_sesion === 'Asistió' ? 'bien' : '') + '">' +
                esc(s.estado_sesion) + '</span></div></div>').join('')
                : '<div class="vacio">No hay sesiones de fotos hoy.</div>';
        }

        if (resumen.cuartos) {
            const e = resumen.cuartos.por_estado || {};
            datos.appendChild(dato('Cuartos ocupados', (e.OCUPADA || 0) + '/' + resumen.cuartos.total,
                (e.DISPONIBLE || 0) + ' disponibles' + (e.MANTENIMIENTO ? ' · ' + e.MANTENIMIENTO + ' en mant.' : ''),
                () => { window.location.href = 'personal_status.html'; }));
        }

        pintarTareas(P.tareas());
    });
})();
</script>
</body>
</html>
